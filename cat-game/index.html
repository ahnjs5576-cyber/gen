/* Layout: one full-screen pixel canvas, crisp HTML HUD on top, thumb controls on touch screens. */
:root {
  --ink: #2a1a10;

  --orange: #f39a3b;
  --orange-deep: #c96a1c;

  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: #1b120c;
  color: var(--cream);
  font-family: var(--ui);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
[hidden] { display: none !important; }
#app {
  position: fixed; inset: 0; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
#stage { position: relative; box-shadow: 0 0 0 3px #000, 0 18px 60px rgba(0,0,0,.5); }
#game { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }

/* HUD */
#hud {
  position: absolute; left: 0; right: 0; top: 0;
  display: flex; align-items: center; justify-content: space-between; gap: .6em;
  padding: .45em .7em;
  font-size: max(11px, calc(var(--s, 3) * 6px));
  color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.55);
  pointer-events: none;
}
.hud-group { display: flex; align-items: center; gap: .8em; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: .25em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip svg { width: 1.25em; height: 1.25em; filter: drop-shadow(0 2px 0 rgba(0,0,0,.45)); }
.chip b { font-weight: 400; min-width: 1.2em; }
#form { padding: .05em .5em; border-radius: .5em; background: rgba(0,0,0,.28); }
#form.big { background: rgba(214,40,58,.55); }
#form.yarn { background: rgba(226,80,95,.75); }
#form.mini { background: rgba(80,150,230,.6); }
#form.star { background: linear-gradient(90deg, #ff7ab6, #ffd34a, #7ad8ff); color: #2a1a10; text-shadow: none; }
#lvname { opacity: .95; white-space: nowrap; }
#time.low { color: var(--danger); }
.hud-btn {
  pointer-events: auto;
  font: inherit; color: #fff; background: rgba(0,0,0,.28); border: 0; border-radius: .5em;
  padding: .15em .55em; cursor: pointer; text-shadow: inherit;
}
.hud-btn[aria-pressed="false"] { opacity: .55; text-decoration: line-through; }
.hud-btn:focus-visible, .btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
@media (max-width: 620px) { #lvname { display: none; } }

/* Overlay panels */
#overlay {
  position: fixed; inset: 0; z-index: 5;
  display: grid; place-items: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  background: radial-gradient(ellipse at center, rgba(27,18,12,.35), rgba(27,18,12,.72));

.panel {

  background: var(--panel); border: 3px solid #000; border-radius: 18px;
  box-shadow: 0 6px 0 #000, inset 0 0 0 3px rgba(243,154,59,.35);

.eyebrow { margin: 0; color: var(--orange); letter-spacing: .08em; font-size: 15px; }
.panel h1 {

  text-shadow: 0 4px 0 var(--orange-deep), 0 8px 0 #000;

.panel h2 { margin: 0; font-weight: 400; font-size: 32px; text-shadow: 0 3px 0 var(--orange-deep), 0 6px 0 #000; text-wrap: balance; }
.panel p { margin: 0; line-height: 1.5; color: var(--muted); font-size: 16px; text-wrap: pretty; }
.keys { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; color: var(--cream); }
.keys li { display: flex; gap: 7px; justify-content: center; align-items: center; flex-wrap: wrap; }
kbd {

.items canvas { width: 26px; height: 26px; image-rendering: pixelated; flex: none; }
.items b { display: block; font-weight: 400; font-size: 14px; color: var(--cream); }
.items span { display: block; font-size: 12px; color: var(--muted); line-height: 1.3; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { background: rgba(255,244,227,.07); border-radius: 10px; padding: 8px 4px; }
.stats span { display: block; font-size: 13px; color: var(--muted); }

.btn.ghost { background: transparent; color: var(--cream); border-color: var(--muted); box-shadow: none; font-size: 18px; padding: 8px 20px; }

#dpad, #abtns { display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; touch-action: none; }

function makeBuilder(W) {

    fill(x0, x1, y0, y1, c) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (inb(x, y)) g[y][x] = c; },
    ground(x0, x1, top = 12) { b.fill(x0, x1, top, ROWS - 1, '#'); },
    row(x, y, s) { for (let i = 0; i < s.length; i++) if (s[i] !== ' ' && inb(x + i, y)) g[y][x + i] = s[i]; },
    stairs(x, h, dir, base = 12) { for (let i = 0; i < h; i++) { const hh = dir > 0 ? i + 1 : h - i; b.fill(x + i, x + i, base - hh, base - 1, 'H'); } },

    const off = (e) => { ids.delete(e.pointerId); if (!ids.size) { set(false); el.classList.remove('on'); } };

  p.prevForm = p.form; p.form = f; p.morph = 36;
  tryResize();
}
function tryResize() {
  const p = player, F = FORMS[p.form];
  if (p.w === F.w && p.h === F.h) { p.pendingSize = false; return; }
  const nx = p.x + p.w / 2 - F.w / 2, ny = p.y + p.h - F.h;
  if (rectFree(nx, ny, F.w, F.h)) { p.x = nx; p.y = ny; p.w = F.w; p.h = F.h; p.pendingSize = false; }
  else p.pendingSize = true;
}

/* ================= physics ================= */
function collideX(o) {
  const top = Math.floor(o.y / T), bot = Math.floor((o.y + o.h - 0.01) / T);
  if (o.vx > 0) {
    const tx = Math.floor((o.x + o.w - 0.01) / T);
    for (let ty = top; ty <= bot; ty++) if (SOLID.has(tile(tx, ty))) { o.x = tx * T - o.w; return 1; }
  } else if (o.vx < 0) {
    const tx = Math.floor(o.x / T);
    for (let ty = top; ty <= bot; ty++) if (SOLID.has(tile(tx, ty))) { o.x = (tx + 1) * T; return -1; }
  }
  return 0;
}
function collideY(o, prevBottom, isPlayer) {
  const l = Math.floor(o.x / T), r = Math.floor((o.x + o.w - 0.01) / T);
  if (o.vy > 0) {
    const ty = Math.floor((o.y + o.h - 0.01) / T);
    for (let tx = l; tx <= r; tx++) {
      const c = tile(tx, ty);
      if (SOLID.has(c) || (c === '-' && prevBottom <= ty * T + 0.5)) { o.y = ty * T - o.h; o.vy = 0; o.onGround = true; return 1; }
    }
  } else if (o.vy < 0) {
    const ty = Math.floor(o.y / T);
    const hits = [];
    for (let tx = l; tx <= r; tx++) { const c = tile(tx, ty); if (SOLID.has(c) || (isPlayer && c === 'I' && o.y > ty * T + 8)) hits.push(tx); }
    if (hits.length) {
      if (isPlayer && hits.length === 1 && tile(hits[0], ty) !== 'I') {
        const tx = hits[0];
        const overL = (o.x + o.w) - tx * T, overR = (tx + 1) * T - o.x;
        if (overL > 0 && overL <= 4 && !SOLID.has(tile(tx - 1, ty))) { o.x = tx * T - o.w; return 0; }
        if (overR > 0 && overR <= 4 && !SOLID.has(tile(tx + 1, ty))) { o.x = (tx + 1) * T; return 0; }
      }
      let best = hits[0], bd = 1e9;
      for (const tx of hits) { const d = Math.abs((tx + 0.5) * T - (o.x + o.w / 2)); if (d < bd) { bd = d; best = tx; } }
      o.y = (ty + 1) * T; o.vy = 0.5;
      if (isPlayer) bumpTile(best, ty);
      return -1;
    }
  }
  return 0;
}

function spawnItem(type, tx, ty) {
  const dims = { can: [10, 9], yarn: [10, 10], milk: [8, 11], nip: [10, 10], gold: [11, 7] }[type];
  items.push({ type, x: tx * T + (T - dims[0]) / 2, y: ty * T, w: dims[0], h: dims[1], vx: 0, vy: 0,
               emerge: 18, startY: ty * T, onGround: false });
}

function bumpTile(tx, ty) {
  const c = lvl.g[ty][tx];
  const cx = tx * T + T / 2, cy = ty * T;
  const used = () => { lvl.g[ty][tx] = 'U'; bumps.set(tx + ',' + ty, 0); };
  if (c === '?') {
    used();
    parts.push({ kind: 'fishpop', x: cx - 5, y: cy - 8, vx: 0, vy: -4.2, g: 0.28, life: 26, t: 0 });
    addFish(1); sfx('fish');
  } else if (c === 'P') { used(); spawnItem(isBig() ? 'yarn' : 'can', tx, ty); sfx('sprout'); }
  else if (c === 'N') { used(); spawnItem('nip', tx, ty); sfx('sprout'); }
  else if (c === 'M') { used(); spawnItem('milk', tx, ty); sfx('sprout'); }
  else if (c === 'I') { used(); spawnItem('gold', tx, ty); sfx('sprout'); }
  else if (c === 'B') {
    if (isBig()) {
      lvl.g[ty][tx] = ' ';
      for (let i = 0; i < 4; i++) parts.push({ kind: 'chunk', x: tx * T + (i % 2) * 8 + 2, y: ty * T + (i < 2 ? 2 : 9), vx: (i % 2 ? 1.4 : -1.4), vy: i < 2 ? -4.5 : -3, g: 0.3, life: 60, t: 0, c: '#c9965a', s: 5 });
      addScore(50); sfx('brk');
    } else { bumps.set(tx + ',' + ty, 0); sfx('bump'); }
  } else { sfx('bump'); }
  const zone = { x: tx * T, y: ty * T - 4, w: T, h: 4 };
  for (const e of enemies) if (e.alive && !e.dying && overlap(e, zone)) killEnemy(e, 'flip');
  for (const it of items) if (!it.emerge && overlap(it, zone)) { it.vy = -4; it.vx = -it.vx || 1; }
  if (tile(tx, ty - 1) === 'o') { lvl.g[ty - 1][tx] = ' '; parts.push({ kind: 'fishpop', x: cx - 5, y: cy - 22, vx: 0, vy: -3, g: 0.28, life: 20, t: 0 }); addFish(1); sfx('fish'); }
}

function killEnemy(e, mode) {
  e.dying = mode; e.dt = 0;
  if (mode === 'flip') { e.vy = -3.6; e.vx = (e.x < player.x ? -0.8 : 0.8); }
  addScore(e.type === 'dog' ? 300 : 100, e.x, e.y - 6);
}

function hurt() {
  const p = player;
  if (p.inv > 0 || p.star > 0) return;
  if (p.form === 'big' || p.form === 'yarn') {
    setForm('small'); p.inv = 120; sfx('shrink'); puff(p.x + p.w / 2, p.y + 4, 8, '#ffd2a0', 1.5); return;
  }
  die();
}
function die(splash) {
  if (state !== 'play') return;
  state = 'dying'; stateT = 0;
  const p = player;
  p.vx = 0; p.vy = splash ? -3 : -6.2; p.star = 0;
  if (splash) { sfx('splash'); for (let i = 0; i < 14; i++) parts.push({ x: p.x + p.w / 2, y: p.y + p.h, vx: (Math.random() - 0.5) * 3, vy: -1 - Math.random() * 3, g: 0.2, life: 40, t: 0, c: '#8fd0f5', s: 2 }); }
  sfx('die');
}

/* ================= update ================= */
function updatePlats() {
  for (const pl of plats) {
    pl.prevY = pl.y;
    const ox = pl.x, oy = pl.y;
    if (pl.kind === 'x') { pl.t++; pl.x = pl.x0 + (1 - Math.cos(pl.t * pl.rate)) / 2 * pl.range; }
    else if (pl.kind === 'y') { pl.t++; pl.y = pl.y0 + (1 - Math.cos(pl.t * pl.rate)) / 2 * pl.range; }
    else if (pl.kind === 'fall') {
      if (pl.gone > 0) { if (--pl.gone === 0) { pl.x = pl.x0; pl.y = pl.y0; pl.vy = 0; pl.fallT = 0; } }
      else if (pl.fallT > 0) {
        pl.fallT++;
        if (pl.fallT > 26) { pl.vy = Math.min(pl.vy + 0.25, 6); pl.y += pl.vy; }
        if (pl.y > VH + 40) { pl.gone = 120; pl.y = -999; }
      }
    }
    pl.dx = pl.x - ox; pl.dy = pl.y - oy;
  }
}

function updatePlayer() {
  const p = player;
  if (p.morph > 0) p.morph--;
  if (p.pendingSize) tryResize();
  // ride platform
  if (p.plat) { const svx = p.vx; p.x += p.plat.dx; p.y += p.plat.dy; p.vx = p.plat.dx; collideX(p); p.vx = svx; }
  const mini = p.form === 'mini';
  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  let max = input.run ? (mini ? 2.8 : 3.1) : (mini ? 1.8 : 1.95);
  if (p.star > 0) max *= 1.12;
  if (dir) {
    const acc = p.onGround ? (Math.sign(p.vx) === -dir ? 0.5 : (input.run ? 0.2 : 0.26)) : 0.2;
    const was = Math.abs(p.vx);
    p.vx += dir * acc;
    if (Math.abs(p.vx) > max) p.vx = Math.sign(p.vx) * Math.max(max, Math.min(Math.abs(p.vx), was - (p.onGround ? 0.12 : 0.03)));
    p.face = dir;
    if (p.onGround && Math.sign(p.vx) === -dir && Math.abs(p.vx) > 1.2 && frame % 4 === 0) puff(p.x + p.w / 2, p.y + p.h, 1, '#e8dccb', 0.6);
  } else {
    p.vx *= p.onGround ? 0.74 : 0.95;
    if (Math.abs(p.vx) < 0.05) p.vx = 0;
  }
  if (input.jumpPressed) p.buffer = 7;
  if (p.onGround) { p.coyote = 6; combo = 0; } else if (p.coyote > 0) p.coyote--;
  if (p.buffer > 0) {
    p.buffer--;
    if (p.coyote > 0) {
      p.vy = mini ? -5.8 : -6.5 - Math.min(0.5, Math.abs(p.vx) * 0.15);
      p.coyote = 0; p.buffer = 0; p.onGround = false; p.plat = null;
      sfx(mini ? 'minijump' : 'jump'); puff(p.x + p.w / 2, p.y + p.h, 3, '#f2e6d4', 0.8);
    }
  }
  const held = p.vy < 0 && input.jump;
  p.vy = Math.min(p.vy + (mini ? (held ? 0.19 : 0.42) : (held ? 0.32 : 0.62)), mini ? 3.6 : 7);

  // throw yarn
  if (p.cd > 0) p.cd--;
  if (input.runPressed && p.form === 'yarn' && p.cd === 0 && balls.length < 2) {
    balls.push({ x: p.x + p.w / 2 + p.face * 6 - 3, y: p.y + 4, w: 6, h: 6, vx: p.face * 3.8, vy: 1, life: 110 });
    p.cd = 12; sfx('throw');
  }

  p.x += p.vx;
  if (p.x < 0) { p.x = 0; p.vx = 0; }
  if (collideX(p)) p.vx = 0;
  const prevBottom = p.y + p.h, wasGround = p.onGround, fallV = p.vy;
  p.y += p.vy;
  p.onGround = false; p.plat = null;
  collideY(p, prevBottom, true);
  if (p.vy >= 0) for (const pl of plats) {
    if (pl.gone || pl.y < -100) continue;
    if (p.x + p.w > pl.x + 1 && p.x < pl.x + pl.w - 1 && p.y + p.h >= pl.y && prevBottom <= pl.y + Math.max(2, Math.abs(pl.dy) + 1.5)) {
      p.y = pl.y - p.h; p.vy = 0; p.onGround = true; p.plat = pl;
      if (pl.kind === 'fall' && pl.fallT === 0) pl.fallT = 1;
      break;
    }
  }
  if (p.onGround && !wasGround && fallV > 4) puff(p.x + p.w / 2, p.y + p.h, 4, '#f2e6d4', 0.9);
  p.anim += p.onGround ? Math.abs(p.vx) : 0;
  if (p.inv > 0) p.inv--;
  if (p.star > 0) { p.star--; if (frame % 3 === 0) sparkle(p.x + p.w / 2, p.y + p.h / 2, 1, 22); }

  // tacks underfoot
  if (p.onGround && !p.plat) {
    const fy = Math.floor((p.y + p.h + 1) / T);
    const l0 = Math.floor((p.x + 2) / T), r0 = Math.floor((p.x + p.w - 2) / T);
    for (let tx = l0; tx <= r0; tx++) if (tile(tx, fy) === 'x') {
      if (p.star <= 0) { const had = p.inv; hurt(); if (state !== 'play') return; if (had <= 0) { p.vy = -5; p.onGround = false; } }
      break;
    }
  }

  // collectibles and hazards
  const l = Math.floor(p.x / T), r = Math.floor((p.x + p.w - 0.01) / T);
  const t0 = Math.floor(p.y / T), t1 = Math.floor((p.y + p.h - 0.01) / T);
  for (let ty = t0; ty <= t1; ty++) for (let tx = l; tx <= r; tx++) {
    const c = tile(tx, ty);
    if (c === 'o') { lvl.g[ty][tx] = ' '; addFish(1); sfx('fish'); parts.push({ kind: 'spark', x: tx * T + 8, y: ty * T + 8, life: 14, t: 0 }); }
    if (c === 'w' && p.y + p.h > ty * T + 5) { die(true); return; }
  }
  if (p.y > VH + 10) { die(); return; }

  const L = lvl.def;
  if (!reachedCheck && p.x + p.w > L.check * T + 4) { reachedCheck = true; sfx('bell'); popups.push({ x: L.check * T - 8, y: lvl.checkY * T - 40, text: '딸랑!', t: 0 }); }
  if (p.x + p.w >= L.goal * T + 2) startClear();
}

function updateEnemies() {
  const p = player;
  const pcx = p.x + p.w / 2;
  for (const e of enemies) {
    if (!e.alive) continue;
    if (!e.active) { if (e.x < cam.x + VW + 24) e.active = true; else continue; }
    e.t++;
    if (e.dying === 'squash') { if (++e.dt > 30) e.alive = false; continue; }
    if (e.dying === 'flip') { e.vy += 0.3; e.x += e.vx; e.y += e.vy; if (e.y > VH + 30) e.alive = false; continue; }

    if (e.type === 'pig') {
      if (e.mode === 'dive') { e.y += 2.4; e.x += e.vx * 0.4; if (e.y >= e.diveTo) e.mode = 'rise'; }
      else if (e.mode === 'rise') { e.y -= 1.1; e.x += e.vx; if (e.y <= e.baseY) { e.y = e.baseY; e.mode = 'cruise'; e.t = 0; } }
      else {
        e.x += e.vx; e.y = e.baseY + Math.sin(e.t * 0.06) * 8;
        if (!e.dived && Math.abs(pcx - (e.x + 6)) < 34 && p.y > e.y + 10) { e.mode = 'dive'; e.dived = true; e.diveTo = Math.min(p.y + p.h - 6, VH - 40); }
      }
      if (e.x < cam.x - 80) e.alive = false;
    } else if (e.type === 'spr') {
      e.vy = Math.min(e.vy + 0.4, 6); const pb = e.y + e.h; e.y += e.vy; collideY(e, pb, false);
      const dx = pcx - (e.x + 6);
      if (--e.shot <= 0) {
        if (Math.abs(dx) < 220) {
          drops.push({ x: e.x + 4, y: e.y - 4, w: 4, h: 4, vx: Math.max(-2.3, Math.min(2.3, dx / 48)), vy: -4.8 });
          drops.push({ x: e.x + 4, y: e.y - 4, w: 4, h: 4, vx: Math.max(-2.3, Math.min(2.3, dx / 48)) * 0.55, vy: -5.6 });
          if (Math.abs(dx) < 160) sfx('drip');
        }
        e.shot = 100;
      }
    } else {
      if (e.type === 'cuc' && e.onGround) {
        e.vx = 0;
        const near = Math.abs(pcx - (e.x + 4)) < 140;
        if (--e.hop <= 0 && near) { e.vy = -4.6; e.vx = Math.sign(pcx - (e.x + 4)) * 0.8; e.hop = 55 + (Math.random() * 45 | 0); e.onGround = false; }
        if (e.hop < 0) e.hop = 0;
      }
      if (e.type === 'dog') {
        if (e.dizzy > 0) { e.dizzy--; e.vx *= 0.8; }
        else {
          const dx = pcx - (e.x + 7);
          if (Math.abs(dx) < 200) { if (e.dir !== Math.sign(dx) && Math.abs(dx) > 10) { e.dir = Math.sign(dx); if (e.t % 40 === 0) sfx('bark'); } }
          e.vx += e.dir * 0.08; if (Math.abs(e.vx) > 1.25) e.vx = Math.sign(e.vx) * 1.25;
          if (e.onGround) {
            const ahead = Math.floor((e.vx > 0 ? e.x + e.w + 2 : e.x - 2) / T), below = Math.floor((e.y + e.h + 2) / T);
            const c = tile(ahead, below);
            if (!SOLID.has(c) && c !== '-') { e.vx = 0; e.dir = -e.dir; }
          }
        }
      }
      e.vy = Math.min(e.vy + 0.4, 6);
      const ovx = e.vx;
      e.x += e.vx;
      if (collideX(e)) {
        if (e.type === 'vac') e.vx = -ovx;
        else if (e.type === 'dog') { if (e.onGround && !e.dizzy) e.vy = -5; e.vx = 0; }
        else e.vx = 0;
      }
      const prevB = e.y + e.h; e.y += e.vy; e.onGround = false; collideY(e, prevB, false);
      if (e.y > VH + 30) { e.alive = false; continue; }
    }

    if (e.type === 'vac') for (const o of enemies) {
      if (o !== e && o.alive && !o.dying && o.type === 'vac' && o.active && overlap(e, o)) {
        if ((e.x < o.x && e.vx > 0) || (e.x > o.x && e.vx < 0)) e.vx = -e.vx;
      }
    }

    if (state === 'play' && !e.dying && overlap(p, e)) {
      if (p.star > 0) { killEnemy(e, 'flip'); sfx('stomp'); continue; }
      const rel = p.vy - (e.vy || 0);
      const fromAbove = p.vy > 0 && rel > -0.5 && (p.y + p.h) - e.y < Math.max(8, rel + 5);
      if (fromAbove) {
        p.y = e.y - p.h;
        p.vy = input.jump ? -6.6 : -4.4;
        const pts = 100 * Math.pow(2, Math.min(combo, 4)); combo++;
        if (e.type === 'dog' && !e.dizzy) { e.dizzy = 200; e.vx = 0; addScore(pts, e.x, e.y - 6); sfx('stomp'); sparkle(e.x + 7, e.y, 4, 10); continue; }
        if (e.type === 'pig') { e.dying = 'flip'; e.vy = -1; e.vx = 0; } else { e.dying = 'squash'; }
        e.dt = 0;
        addScore(pts, e.x, e.y - 6); sfx('stomp');
        puff(e.x + e.w / 2, e.y, 5, '#ffffff', 1);
      } else if (!(e.type === 'dog' && e.dizzy > 0)) hurt();
      if (state !== 'play') return;
    }
  }
}

function updateBalls() {
  for (const b of balls) {
    b.life--; b.vy = Math.min(b.vy + 0.35, 5);
    b.x += b.vx;
    if (collideX(b)) { b.life = 0; puff(b.x + 3, b.y + 3, 4, '#e2505f', 0.8); continue; }
    const pb = b.y + b.h; b.y += b.vy; b.onGround = false;
    if (collideY(b, pb, false) === 1) b.vy = -3.3;
    if (b.y > VH || b.x < cam.x - 20 || b.x > cam.x + VW + 20) b.life = 0;
    for (const e of enemies) if (e.alive && e.active && !e.dying && overlap(b, e)) { killEnemy(e, 'flip'); sfx('stomp'); b.life = 0; puff(b.x + 3, b.y + 3, 5, '#ff9aa4', 1); break; }
  }
  balls = balls.filter(b => b.life > 0);
}

function updateDrops() {
  for (const d of drops) {
    d.vy += 0.2; d.x += d.vx; d.y += d.vy;
    const c = tile(Math.floor((d.x + 2) / T), Math.floor((d.y + 3) / T));
    if (SOLID.has(c) || d.y > VH) { d.dead = true; puff(d.x + 2, d.y + 2, 3, '#8fd0f5', 0.7); continue; }
    if (state === 'play' && overlap(d, player)) { d.dead = true; if (player.star <= 0) hurt(); }
  }
  drops = drops.filter(d => !d.dead);
}

function updateItems() {
  for (const it of items) {
    if (it.dead) continue;
    if (it.emerge > 0) {
      it.emerge--; it.y = it.startY - (18 - it.emerge) / 18 * it.h;
      if (it.emerge === 0) {
        const away = player.x + player.w / 2 < it.x + it.w / 2 ? 1 : -1;
        it.vx = { can: 1.1, milk: 0.9, gold: 1.4, nip: 1.4, yarn: 0 }[it.type] * away;
        if (it.type === 'nip') it.vy = -4;
      }
      continue;
    }
    if (it.type !== 'yarn') {
      it.vy = Math.min(it.vy + 0.32, 6);
      const ovx = it.vx; it.x += it.vx; if (collideX(it)) it.vx = -ovx;
      const pb = it.y + it.h; it.y += it.vy; it.onGround = false;
      if (collideY(it, pb, false) === 1 && it.type === 'nip') it.vy = -4.6;
      if (it.y > VH + 20) it.dead = true;
    }
    if (overlap(player, it)) { it.dead = true; collect(it); }
  }
  items = items.filter(i => !i.dead);
}
function collect(it) {
  const p = player, cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  if (it.type === 'can') { if (p.form === 'small' || p.form === 'mini') { setForm('big'); sfx('grow'); } else sfx('power'); addScore(1000, it.x, it.y - 6); }
  else if (it.type === 'yarn') { setForm('yarn'); sfx('power'); addScore(1000, it.x, it.y - 6); meow(1.1); }
  else if (it.type === 'milk') { setForm('mini'); sfx('mini'); addScore(1000, it.x, it.y - 6); meow(1.6); }
  else if (it.type === 'nip') { p.star = STAR_TIME; sfx('star'); addScore(1000, it.x, it.y - 6); meow(1.25); }
  else if (it.type === 'gold') { addLife(it.x, it.y - 6); addScore(1000); }
  sparkle(cx, cy, 14, 26);
}

function updateParts() {
  for (const q of parts) { q.t++; if (q.vx !== undefined) { q.vy += q.g || 0; q.x += q.vx; q.y += q.vy; } }
  parts = parts.filter(q => q.t < q.life);
  for (const q of popups) q.t++;
  popups = popups.filter(q => q.t < 45);
  for (const [k, v] of bumps) { if (v >= 10) bumps.delete(k); else bumps.set(k, v + 1); }
}

function updateCamera(snap) {
  const target = clampCam(player.x + player.w / 2 - VW * 0.42);
  cam.x = snap ? target : cam.x + (target - cam.x) * 0.14;
}

function startClear() {
  state = 'clear'; stateT = 0;
  const L = lvl.def, p = player;
  p.clearFrom = { x: p.x, y: p.y };
  p.clearTo = { x: L.goal * T + 8 - p.w / 2, y: lvl.goalY * T - 82 - p.h };
  p.vx = 0; p.vy = 0; p.face = 1; p.star = 0; p.plat = null;
  sfx('clear'); setTimeout(() => meow(1.05), 450);
}

function step() {
  frame++; stateT++;
  if (state === 'play') {
    updatePlats();
    updatePlayer();
    if (state === 'play') updateEnemies();
    updateBalls();
    updateDrops();
    updateItems();
    updateParts();
    updateCamera(false);

    }
  } else if (state === 'intro') {
    updatePlats(); updateParts();
    if (stateT > 110) { hide(); overlay.style.pointerEvents = ''; state = 'play'; }
  } else if (state === 'dying') {
    const p = player;
    if (stateT > 28) { p.vy += 0.35; p.y += p.vy; }
    updateParts();
    if (stateT > 130) {
      lives--; carryForm = 'small';

        show(`<div class="panel"><p class="eyebrow">아홉 목숨을 모두 썼어요</p><h2>게임 오버</h2>${statsHtml()}

    p.y = p.clearFrom.y + (p.clearTo.y - p.clearFrom.y) * e - Math.sin(k * Math.PI) * 30;

    } else if (stateT > 150) {
      carryForm = p.form;
      if (levelIndex + 1 < LEVELS.length) { reachedCheck = false; beginLevel(levelIndex + 1, false); }
      else {
        state = 'win'; const nb = saveBest();

          <div class="row-btns"><button class="btn" type="button" data-act="start">한 번 더</button><button class="btn ghost" type="button" data-act="title">처음으로</button></div></div>`);

function drawRain() {

  for (let i = 0; i < 70; i++) {
    const x = ((i * 53 - frame * 1.5 - cam.x * 0.6) % (VW + 20) + VW + 20) % (VW + 20) - 10;

function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function cloud(x, y, s) {
  const r = 8 * s;
  circle(x, y, r); circle(x + r * 1.1, y - r * 0.5, r * 1.15); circle(x + r * 2.3, y, r * 0.95);
  ctx.fillRect(x, y, r * 2.3, r * 0.9);
}

function drawTiles() {
  const th = lvl.theme;
  const c0 = Math.max(0, Math.floor(cam.x / T)), c1 = Math.min(lvl.W - 1, Math.floor((cam.x + VW) / T) + 1);
  const ox = -Math.round(cam.x);
  for (let ty = 0; ty < ROWS; ty++) for (let tx = c0; tx <= c1; tx++) {
    const c = lvl.g[ty][tx];
    if (c === ' ' || c === 'I') continue;
    const x = tx * T + ox;
    let y = ty * T;
    const bk = bumps.get(tx + ',' + ty);
    if (bk !== undefined) y -= Math.round(Math.sin((bk / 10) * Math.PI) * 5);
    switch (c) {
      case '#': drawGround(x, y, tx, ty, th); break;
      case 'x': drawGround(x, y, tx, ty, th); drawTacks(x, y); break;
      case 'H': drawBlock(x, y, th); break;
      case 'B': drawBox(x, y); break;
      case '?': case 'P': case 'N': case 'M': drawYarnBox(x, y, tx); break;
      case 'U': drawUsed(x, y); break;
      case '-': drawShelf(x, y, tx, ty); break;
      case 'o': drawFish(ctx, x + 3, y + 4 + Math.round(Math.sin(frame * 0.08 + tx * 0.7) * 1.5)); break;
      case 'w': drawWater(x, y, tx); break;
    }
  }
}
function drawGround(x, y, tx, ty, th) {
  ctx.fillStyle = th.dirt; ctx.fillRect(x, y, T, T);
  const h = hash(tx, ty);
  ctx.fillStyle = th.dirt2;
  ctx.fillRect(x + (h % 11) + 1, y + ((h >> 4) % 10) + 4, 2, 2);
  ctx.fillRect(x + ((h >> 8) % 9) + 4, y + ((h >> 12) % 8) + 2, 3, 1);
  if (!SOLID.has(tile(tx, ty - 1))) {
    ctx.fillStyle = th.top2; ctx.fillRect(x, y, T, 6);
    ctx.fillStyle = th.top; ctx.fillRect(x, y, T, 4);
    if (th.nearKind === 'roof') {
      ctx.fillStyle = th.top2; ctx.fillRect(x + 7, y, 1, 4); ctx.fillRect(x + 15, y, 1, 4);
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x, y, T, 1);
    } else if (th.rain) {
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x, y, T, 1);
      ctx.fillStyle = th.top2; ctx.fillRect(x + (h % 12), y + 1, 3, 1);
    } else {
      ctx.fillStyle = th.top2;
      ctx.fillRect(x + (h % 13), y - 1, 1, 1); ctx.fillRect(x + ((h >> 5) % 13) + 1, y - 2, 1, 2);
      ctx.fillRect(x + ((h >> 3) % 6) * 2, y + 4, 2, 2);

}
function drawTacks(x, y) {

/* the cat is drawn once into a small sprite canvas, then scaled crisply for each size */
function renderCat(pose, phase, o) {

  const R = [];
  const a = (x, y, w, h) => R.push(x, y, w, h);
  const sw = Math.round(Math.sin(frame * (pose === 'run' ? 0.3 : 0.1)) * 1);
  const hb = pose === 'run' && phase ? 1 : 0;
  if (pose === 'run' || pose === 'jump') { a(0, 6, 3, 2); a(-2, 5, 3, 2); a(-3 + sw, 3, 2, 3); }
  else { a(1, 6, 2, 3); a(0, 3, 2, 4); a(1 + sw, 1, 2, 3); }
  a(2, 6, 10, 5);
  a(9, 1 + hb, 7, 6); a(9, -1 + hb, 2, 3); a(14, -1 + hb, 2, 3);
  if (pose === 'run') { if (phase) { a(3, 11, 2, 2); a(5, 11, 2, 2); a(8, 11, 2, 2); a(10, 11, 2, 2); } else { a(1, 10, 2, 3); a(4, 11, 2, 2); a(8, 11, 2, 2); a(11, 10, 2, 3); } }
  else if (pose === 'jump') { a(0, 9, 3, 2); a(2, 10, 3, 2); a(10, 10, 3, 2); a(12, 9, 3, 2); }
  else if (pose === 'fall') { a(2, 11, 2, 2); a(5, 11, 2, 2); a(8, 11, 2, 2); a(11, 11, 2, 2); }
  else { a(2, 11, 2, 2); a(5, 11, 2, 2); a(8, 11, 2, 2); a(10, 11, 2, 2); }
  g.fillStyle = '#3a2213';
  for (let i = 0; i < R.length; i += 4) g.fillRect(R[i] - 1, R[i + 1] - 1, R[i + 2] + 2, R[i + 3] + 2);
  g.fillStyle = pal.fur;
  for (let i = 0; i < R.length; i += 4) g.fillRect(R[i], R[i + 1], R[i + 2], R[i + 3]);
  g.fillStyle = pal.stripe;
  g.fillRect(4, 6, 1, 3); g.fillRect(6, 6, 1, 2); g.fillRect(8, 6, 1, 3);
  g.fillRect(12, 1 + hb, 1, 2); g.fillRect(10, 1 + hb, 1, 1); g.fillRect(14, 1 + hb, 1, 1);
  if (pose === 'run' || pose === 'jump') g.fillRect(-2, 5, 1, 2); else g.fillRect(0, 4, 2, 1);
  g.fillStyle = '#fff3e2';
  g.fillRect(4, 10, 6, 1); g.fillRect(10, 6 + hb, 2, 3);
  g.fillRect(12, 4 + hb, 4, 3);
  if (pose === 'run' || pose === 'jump') g.fillRect(-3 + sw, 3, 2, 1); else g.fillRect(1 + sw, 1, 2, 1);
  g.fillStyle = '#f49aae'; g.fillRect(10, 0 + hb, 1, 1); g.fillRect(14, 0 + hb, 1, 1); g.fillRect(14, 4 + hb, 1, 1);
  g.fillStyle = '#24180f';
  if (o.dead) { g.fillRect(11, 2, 1, 1); g.fillRect(12, 3, 1, 1); g.fillRect(12, 2, 1, 1); g.fillRect(11, 3, 1, 1); g.fillRect(15, 2, 1, 2); }
  else if (o.happy || (frame % 200) < 6) { g.fillRect(11, 3 + hb, 2, 1); g.fillRect(15, 3 + hb, 1, 1); }
  else { g.fillRect(12, 2 + hb, 1, 2); g.fillRect(15, 2 + hb, 1, 2); g.fillStyle = '#fff'; g.fillRect(12, 2 + hb, 1, 1); }
  g.fillStyle = 'rgba(255,255,255,.75)'; g.fillRect(16, 4 + hb, 2, 1); g.fillRect(16, 6 + hb, 2, 1);
  if (o.collar) {
    g.fillStyle = o.yarn ? '#4f8be0' : '#d6283a'; g.fillRect(9, 7, 4, 1);
    g.fillStyle = '#ffd34a'; g.fillRect(11, 8, 2, 2);
    g.fillStyle = '#8a5a00'; g.fillRect(11, 9, 2, 1);
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
}
function blitCat(cx, feetY, face, s, flipY) {
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(feetY - 8 * s));
  ctx.scale(face < 0 ? -1 : 1, flipY ? -1 : 1);
  ctx.drawImage(spr, -12 * s, -8 * s, 24 * s, 18 * s);
  ctx.restore();
}

function drawPlayer() {
  const p = player;
  if (p.inv > 0 && Math.floor(p.inv / 3) % 2 === 0 && state === 'play') return;
  let pose = 'idle';
  if (state === 'clear') pose = stateT > 45 ? 'idle' : 'jump';
  else if (!p.onGround) pose = p.vy < 0 ? 'jump' : 'fall';
  else if (Math.abs(p.vx) > 0.3) pose = 'run';
  const phase = Math.floor(p.anim / (input.run ? 6 : 7)) % 2;
  let form = p.form;
  if (p.morph > 0 && Math.floor(p.morph / 4) % 2) form = p.prevForm;
  const s = FORMS[form].s;
  const cx = p.x + p.w / 2 - cam.x, fy = p.y + p.h;
  if (state === 'dying') { renderCat('fall', 0, { dead: true }); blitCat(cx, fy, p.face, s, true); return; }
  renderCat(pose, phase, { collar: form === 'big' || form === 'yarn', yarn: form === 'yarn', star: p.star > 0 && (p.star > 90 || frame % 8 < 5), happy: state === 'clear' && stateT > 45 });
  blitCat(cx, fy, p.face, s, false);
}

function drawEnemy(e) {
  const x = Math.round(e.x - cam.x), y = Math.round(e.y);
  if (x < -30 || x > VW + 30) return;
  ctx.save();
  if (e.dying === 'flip') { ctx.translate(x, y + e.h / 2); ctx.scale(1, -1); ctx.translate(-x, -y - e.h / 2); }
  if (e.type === 'vac') {
    if (e.dying === 'squash') {
      ctx.fillStyle = '#1f2228'; ctx.fillRect(x, y + 4, 14, 3);
      ctx.fillStyle = '#5b6270'; ctx.fillRect(x + 1, y + 4, 12, 2);
      ctx.fillStyle = '#ff5050'; ctx.fillRect(x + 6, y + 4, 2, 1);
    } else {
      ctx.fillStyle = '#1f2228';
      ctx.fillRect(x + 2, y, 10, 1); ctx.fillRect(x, y + 1, 14, 5); ctx.fillRect(x + 1, y + 6, 12, 1);
      ctx.fillStyle = '#5b6270'; ctx.fillRect(x + 1, y + 2, 12, 4);
      ctx.fillStyle = '#8b93a3'; ctx.fillRect(x + 2, y + 1, 10, 2);
      ctx.fillStyle = '#c3c9d4'; ctx.fillRect(x + 4, y + 1, 4, 1);
      const front = e.vx < 0 ? x + 2 : x + 10;
      ctx.fillStyle = (Math.floor(e.t / 15) % 2) ? '#5cff8a' : '#2ea859';
      ctx.fillRect(front, y + 3, 2, 1);
      ctx.fillStyle = '#ffd34a';
      const bx = e.vx < 0 ? x - 1 : x + 13, k = Math.floor(e.t / 3) % 2;
      ctx.fillRect(bx - k, y + 6, 1 + k * 2, 1);
    }
  } else if (e.type === 'cuc') {
    if (e.dying === 'squash') { ctx.translate(x, y + e.h); ctx.scale(1.3, 0.35); ctx.translate(-x - 1, -y - e.h); }
    ctx.fillStyle = '#1b3d14'; ctx.fillRect(x + 1, y, 6, 14); ctx.fillRect(x, y + 2, 8, 10);
    ctx.fillStyle = '#4f9d3a'; ctx.fillRect(x + 1, y + 1, 6, 12);
    ctx.fillStyle = '#86c95e'; ctx.fillRect(x + 2, y + 1, 1, 11);
    ctx.fillStyle = '#2d5e22'; ctx.fillRect(x + 5, y + 9, 1, 1); ctx.fillRect(x + 3, y + 11, 1, 1); ctx.fillRect(x + 5, y + 12, 1, 1);
    ctx.fillStyle = '#7a5a20'; ctx.fillRect(x + 3, y - 1, 2, 2);
    const look = (player.x + player.w / 2) < (e.x + 4) ? 0 : 1;
    ctx.fillStyle = '#fff'; ctx.fillRect(x + 1, y + 4, 3, 3); ctx.fillRect(x + 4, y + 4, 3, 3);
    ctx.fillStyle = '#000'; ctx.fillRect(x + 2 + look, y + 5, 1, 2); ctx.fillRect(x + 5 + look, y + 5, 1, 2);
    ctx.fillRect(x + 1, y + 3, 2, 1); ctx.fillRect(x + 5, y + 3, 2, 1);
    ctx.fillRect(x + 3, y + 8, 2, 1);
  } else if (e.type === 'pig') {
    const flap = Math.floor(e.t / (e.mode === 'dive' ? 3 : 6)) % 2;
    ctx.fillStyle = '#2e3341';
    ctx.fillRect(x + 1, y + 3, 10, 5); ctx.fillRect(x, y + 1, 4, 4); ctx.fillRect(x + 10, y + 4, 2, 2);
    ctx.fillStyle = '#9aa3b5'; ctx.fillRect(x + 2, y + 4, 8, 3); ctx.fillRect(x + 1, y + 2, 2, 2);
    ctx.fillStyle = '#6fbf9a'; ctx.fillRect(x + 2, y + 3, 2, 2);
    ctx.fillStyle = '#e8b04a'; ctx.fillRect(x - 1, y + 3, 1, 1);
    ctx.fillStyle = e.mode === 'dive' ? '#ff3030' : '#ff7a3a'; ctx.fillRect(x + 1, y + 2, 1, 1);
    ctx.fillStyle = '#2e3341';
    if (flap) { ctx.fillRect(x + 4, y - 1, 5, 4); ctx.fillStyle = '#c3cad8'; ctx.fillRect(x + 5, y, 3, 3); }
    else { ctx.fillRect(x + 4, y + 5, 5, 4); ctx.fillStyle = '#c3cad8'; ctx.fillRect(x + 5, y + 6, 3, 2); }
  } else if (e.type === 'dog') {
    if (e.dying === 'squash') { ctx.translate(x, y + e.h); ctx.scale(1.2, 0.4); ctx.translate(-x - 1, -y - e.h); }
    const f = e.vx < -0.05 ? -1 : e.vx > 0.05 ? 1 : (e.dir || -1);
    ctx.translate(x + 7, 0); ctx.scale(f, 1); ctx.translate(-x - 7, 0);
    const leg = e.dizzy ? 0 : Math.floor(e.t / 5) % 2;
    ctx.fillStyle = '#2a1a10';
    ctx.fillRect(x, y + 3, 11, 6); ctx.fillRect(x + 8, y, 7, 6);
    ctx.fillRect(x + 1 + leg, y + 8, 2, 3); ctx.fillRect(x + 8 - leg, y + 8, 2, 3); ctx.fillRect(x - 2, y + 2, 3, 2);
    ctx.fillStyle = '#a8784e'; ctx.fillRect(x + 1, y + 4, 9, 4); ctx.fillRect(x + 9, y + 1, 5, 4);
    ctx.fillStyle = '#f2e2c8'; ctx.fillRect(x + 11, y + 3, 3, 2); ctx.fillRect(x + 3, y + 7, 5, 1);
    ctx.fillStyle = '#6b4a2e'; ctx.fillRect(x + 8, y + 1, 2, 4);
    ctx.fillStyle = '#000'; ctx.fillRect(x + 14, y + 2, 1, 1);
    ctx.fillStyle = e.dizzy ? '#000' : '#fff'; ctx.fillRect(x + 11, y + 1, 1, 1);
    if (!e.dizzy && Math.floor(e.t / 8) % 3 === 0) { ctx.fillStyle = '#f49aae'; ctx.fillRect(x + 12, y + 5, 2, 2); }
    ctx.fillStyle = '#3b7fd1'; ctx.fillRect(x + 8, y + 5, 2, 2);
    if (e.dizzy) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const a = e.t * 0.2;
      ctx.fillStyle = '#ffd34a';
      for (let k = 0; k < 3; k++) { const ang = a + k * 2.1; ctx.fillRect(Math.round(x + 7 + Math.cos(ang) * 7), Math.round(y - 3 + Math.sin(ang) * 2), 2, 2); }
    }
  } else if (e.type === 'spr') {
    if (e.dying === 'squash') { ctx.fillStyle = '#2d5e22'; ctx.fillRect(x, y + 5, 12, 3); ctx.restore(); return; }
    ctx.fillStyle = '#1b3d14'; ctx.fillRect(x, y + 4, 12, 4); ctx.fillRect(x + 3, y, 6, 5);
    ctx.fillStyle = '#3d9a52'; ctx.fillRect(x + 1, y + 5, 10, 2);
    ctx.fillStyle = '#9aa3b5'; ctx.fillRect(x + 4, y + 1, 4, 3);
    const k = Math.floor(e.t / 6) % 3;
    ctx.fillStyle = '#5a6275'; ctx.fillRect(x + 3 + k * 2, y, 2, 1);
    if (e.shot < 16) { ctx.fillStyle = '#8fd0f5'; ctx.fillRect(x + 5, y - 2 - (16 - e.shot) / 6, 2, 2); }
  }
  ctx.restore();
}

function drawCheckpoint() {
  const L = lvl.def;
  const x = Math.round(L.check * T - cam.x) + 4, gy = lvl.checkY * T;
  if (x < -20 || x > VW + 20) return;
  ctx.fillStyle = '#3d2610'; ctx.fillRect(x + 3, gy - 30, 3, 30); ctx.fillRect(x - 1, gy - 2, 11, 2);
  ctx.fillStyle = '#8a5a30'; ctx.fillRect(x + 4, gy - 30, 1, 28);
  ctx.fillStyle = '#3d2610'; ctx.fillRect(x + 4, gy - 34, 9, 2); ctx.fillRect(x + 11, gy - 32, 1, 3);
  const sway = reachedCheck ? Math.round(Math.sin(frame * 0.15) * 1) : 0;
  ctx.fillStyle = reachedCheck ? '#d6283a' : '#7a7a7a'; ctx.fillRect(x + 9 + sway, gy - 29, 5, 2);
  ctx.fillStyle = '#3a2a00'; ctx.fillRect(x + 8 + sway, gy - 27, 7, 7);
  ctx.fillStyle = reachedCheck ? '#ffd34a' : '#b9b9b9'; ctx.fillRect(x + 9 + sway, gy - 26, 5, 5);
  ctx.fillStyle = reachedCheck ? '#fff3b0' : '#e0e0e0'; ctx.fillRect(x + 10 + sway, gy - 25, 1, 1);
  ctx.fillStyle = '#3a2a00'; ctx.fillRect(x + 10 + sway, gy - 23, 3, 1);
}

function drawTower() {
  const L = lvl.def;
  const x = Math.round(L.goal * T - cam.x), gy = lvl.goalY * T;
  if (x < -60 || x > VW + 60) return;
  const line = '#2a1a10';
  ctx.fillStyle = line; ctx.fillRect(x - 10, gy - 6, 36, 6);
  ctx.fillStyle = '#9b86d1'; ctx.fillRect(x - 9, gy - 5, 34, 4);
  ctx.fillStyle = line; ctx.fillRect(x + 4, gy - 84, 8, 80); ctx.fillRect(x + 18, gy - 46, 6, 42);
  ctx.fillStyle = '#d9b98a'; ctx.fillRect(x + 5, gy - 84, 6, 80); ctx.fillRect(x + 19, gy - 46, 4, 42);
  ctx.fillStyle = '#b48f5f';
  for (let yy = gy - 82; yy < gy - 6; yy += 3) ctx.fillRect(x + 5, yy, 6, 1);
  for (let yy = gy - 44; yy < gy - 6; yy += 3) ctx.fillRect(x + 19, yy, 4, 1);
  ctx.fillStyle = line; ctx.fillRect(x - 6, gy - 50, 34, 6);
  ctx.fillStyle = '#9b86d1'; ctx.fillRect(x - 5, gy - 49, 32, 4);
  ctx.fillStyle = '#c9bbef'; ctx.fillRect(x - 5, gy - 49, 32, 1);
  const swing = Math.sin(frame * 0.05) * 3;
  ctx.fillStyle = line; ctx.fillRect(Math.round(x - 3 + swing / 2), gy - 44, 1, 12);
  ctx.fillStyle = '#e2505f'; circle(x - 3 + swing, gy - 30, 3.2);
  ctx.fillStyle = line; ctx.fillRect(x - 4, gy - 90, 24, 8);
  ctx.fillStyle = '#9b86d1'; ctx.fillRect(x - 3, gy - 89, 22, 6);
  ctx.fillStyle = '#c9bbef'; ctx.fillRect(x - 3, gy - 89, 22, 2);
  ctx.fillStyle = line; ctx.fillRect(x + 22, gy - 106, 1, 18);
  ctx.fillStyle = '#ffd34a'; ctx.fillRect(x + 23, gy - 106, 8, 5); ctx.fillRect(x + 23, gy - 101, 4, 2);
}

function drawParts() {
  for (const q of parts) {
    const x = Math.round(q.x - cam.x), y = Math.round(q.y);
    if (q.kind === 'fishpop') { drawFish(ctx, x, y); continue; }
    if (q.kind === 'spark') {
      const k = q.t / q.life, s = k < 0.5 ? 1 : 0;
      ctx.fillStyle = k < 0.5 ? '#fff6b0' : '#ffd34a';
      ctx.fillRect(x - 2 - s, y, 5 + s * 2, 1); ctx.fillRect(x, y - 2 - s, 1, 5 + s * 2);
      continue;
    }
    if (q.kind === 'chunk') { ctx.fillStyle = '#3d2610'; ctx.fillRect(x - 1, y - 1, q.s + 2, q.s + 2); ctx.fillStyle = q.c; ctx.fillRect(x, y, q.s, q.s); continue; }
    ctx.globalAlpha = 1 - q.t / q.life;
    ctx.fillStyle = q.c; ctx.fillRect(x, y, q.s, q.s);
    ctx.globalAlpha = 1;
  }
  for (const b of balls) {
    const x = Math.round(b.x - cam.x), y = Math.round(b.y);
    ctx.fillStyle = '#5a1420'; ctx.fillRect(x, y + 1, 6, 4); ctx.fillRect(x + 1, y, 4, 6);
    ctx.fillStyle = '#e2505f'; ctx.fillRect(x + 1, y + 1, 4, 4);
    ctx.fillStyle = '#ff9aa4'; ctx.fillRect(x + 1 + (frame >> 2) % 3, y + 2, 2, 1);
  }
  for (const d of drops) {
    const x = Math.round(d.x - cam.x), y = Math.round(d.y);
    ctx.fillStyle = '#1f4f86'; ctx.fillRect(x, y + 1, 4, 3); ctx.fillRect(x + 1, y, 2, 4);
    ctx.fillStyle = '#8fd0f5'; ctx.fillRect(x + 1, y + 1, 2, 2);
  }
  ctx.font = 'bold 8px monospace'; ctx.textAlign = 'center';
  for (const q of popups) {
    const x = Math.round(q.x - cam.x + 6), y = Math.round(q.y - q.t * 0.5);
    ctx.fillStyle = '#000'; ctx.fillText(q.text, x + 1, y + 1);
    ctx.fillStyle = q.big ? '#7dff8a' : '#fff'; ctx.fillText(q.text, x, y);
  }
}

function render() {
  if (!lvl) return;
  ctx.imageSmoothingEnabled = false;
  drawBackground();
  drawCheckpoint();
  drawTower();
  for (const pl of plats) drawPlat(pl);
  drawTiles();
  for (const it of items) {
    const bob = it.type === 'yarn' && !it.emerge ? Math.round(Math.sin(frame * 0.1)) : 0;
    drawItemOn(ctx, it.type, Math.round(it.x - cam.x), Math.round(it.y) + bob);
  }
  for (const e of enemies) if (e.alive && e.active) drawEnemy(e);
  if (state !== 'title') drawPlayer();
  else {
    renderCat('idle', 0, {});
    blitCat(player.x + player.w / 2 - cam.x, player.y + player.h, Math.floor(frame / 150) % 2 ? -1 : 1, 1, false);
  }
  drawParts();
  if (lvl.theme.rain) drawRain();
  if (state === 'dying' && stateT > 100) { ctx.fillStyle = `rgba(0,0,0,${(stateT - 100) / 30})`; ctx.fillRect(0, 0, VW, VH); }
}

/* ================= sizing ================= */
function resize() {
  $('touch').hidden = !isTouch;
  const portrait = innerHeight > innerWidth;
  const reserve = isTouch && portrait ? 200 : 0;
  app.style.paddingBottom = `calc(env(safe-area-inset-bottom, 0px) + ${reserve}px)`;
  const cs = getComputedStyle(app);
  const aw = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  VW = Math.max(256, Math.min(448, Math.round((VH * aw / Math.max(1, ah)) / 2) * 2));
  cv.width = VW; cv.height = VH;
  const s = Math.max(0.5, Math.min(aw / VW, ah / VH));
  stage.style.width = Math.floor(VW * s) + 'px';
  stage.style.height = Math.floor(VH * s) + 'px';
  document.documentElement.style.setProperty('--s', s.toFixed(3));
  skyGrad = null;
  if (lvl) cam.x = clampCam(cam.x);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));

/* ================= loop ================= */
let last = 0, acc = 0;
const STEP = 1000 / 60;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!last) last = ts;
  acc += Math.min(100, ts - last); last = ts;
  let n = 0;
  while (acc >= STEP && n < 5) { step(); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  render();
}

/* ================= boot ================= */
function start(data) {
  resize();
  if (data && typeof data.level === 'number' && data.lives > 0 && data.state && data.state !== 'title') {
    lives = data.lives; fish = data.fish || 0; score = data.score || 0; carryForm = FORMS[data.form] ? data.form : 'small';
    beginLevel(Math.min(LEVELS.length - 1, data.level), false);
  } else toTitle();
  requestAnimationFrame(loop);
}
try { window.claude?.hot?.snapshot?.(() => ({ level: levelIndex, lives, fish, score, state, form: player && player.form })); } catch (e) {}
const hot = window.claude?.hot;
if (hot?.ready) hot.ready(start); else start(hot?.data ?? {});

// small handle for automated checks
window.__nabi = {
  get state() { return state; }, get player() { return player; }, get level() { return levelIndex; }, get cam() { return cam; },
  get lvl() { return lvl; }, get enemies() { return enemies; }, get plats() { return plats; }, get lives() { return lives; },
  input, loadLevel: (i) => beginLevel(i, false), setForm: (f) => setForm(f), give: (t) => collect({ type: t, x: player.x, y: player.y })
};
})();
</script>
