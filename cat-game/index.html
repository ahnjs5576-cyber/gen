<style>
/* Layout: one full-screen pixel canvas, crisp HTML HUD on top, thumb controls on touch screens. */
:root {
  --ink: #2a1a10;
  --panel: rgba(38, 24, 15, 0.9);
  --cream: #fff4e3;
  --orange: #f39a3b;
  --orange-deep: #c96a1c;

}
html, body { height: 100%; margin: 0; }
body {
  background: #1b120c;

  font-family: var(--ui);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;

}

}

/* HUD */
#hud {

  padding: .45em .7em;
  font-size: max(11px, calc(var(--s, 3) * 6.2px));
  color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.55);

}
.hud-group { display: flex; align-items: center; gap: .9em; }
.chip { display: inline-flex; align-items: center; gap: .25em; font-variant-numeric: tabular-nums; }
.chip svg { width: 1.25em; height: 1.25em; filter: drop-shadow(0 2px 0 rgba(0,0,0,.45)); }

/* Overlay panels */

<script>

/* ================= constants ================= */
const T = 16, ROWS = 14, VH = ROWS * T;

const isTouch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);

/* ================= themes ================= */
const THEMES = {

  },

    top: '#c9584e', top2: '#8f3438', dirt: '#6f4752', dirt2: '#5a3843',

  },

    top: '#3f9a62', top2: '#2a6e46', dirt: '#3c3554', dirt2: '#2c2742',

/* ================= levels =================

      b.row(153, 8, 'oo'); b.row(157, 8, 'oo');

];

function makeBuilder(W) {
  const g = Array.from({ length: ROWS }, () => new Array(W).fill(' '));
  const ents = [];
  const inb = (x, y) => x >= 0 && x < W && y >= 0 && y < ROWS;
  const b = {
    fill(x0, x1, y0, y1, c) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (inb(x, y)) g[y][x] = c; },
    ground(x0, x1, top = 12) { b.fill(x0, x1, top, ROWS - 1, '#'); },
    row(x, y, s) { for (let i = 0; i < s.length; i++) if (s[i] !== ' ' && inb(x + i, y)) g[y][x + i] = s[i]; },
    stairs(x, h, dir, base = 12) { for (let i = 0; i < h; i++) { const hh = dir > 0 ? i + 1 : h - i; b.fill(x + i, x + i, base - hh, base - 1, 'H'); } },
    e(type, x, y) { ents.push({ type, x, y }); }
  };
  return { b, g, ents };
}

/* ================= state ================= */
let lvl = null;           // current level runtime
let levelIndex = 0;
let lives = START_LIVES, fish = 0, score = 0, best = 0;
let state = 'title';      // title | intro | play | paused | dying | clear | gameover | win
let stateT = 0, frame = 0;
let player, enemies, items, parts, popups, bumps;
let cam = { x: 0 };
let timeLeft = 300, timeTick = 0, combo = 0;
let reachedCheck = false;
let skyGrad = null;

try { best = parseInt(localStorage.getItem('nabi-best') || '0', 10) || 0; } catch (e) { best = 0; }

function tile(tx, ty) {
  if (ty < 0 || ty >= ROWS) return ' ';
  if (tx < 0 || tx >= lvl.W) return '#';
  return lvl.g[ty][tx];
}
function groundTopAt(tx) { for (let y = 0; y < ROWS; y++) if (SOLID.has(tile(tx, y))) return y; return 12; }

function loadLevel(i, fromCheck) {
  levelIndex = i;
  const L = LEVELS[i];
  const { b, g, ents } = makeBuilder(L.width);
  L.build(b);
  lvl = { W: L.width, g, def: L, theme: THEMES[L.theme], bg: genBg(i, L.width) };
  lvl.goalY = groundTopAt(L.goal);
  lvl.checkY = groundTopAt(L.check);
  enemies = ents.map(spawnEnemy);
  items = []; parts = []; popups = []; bumps = new Map();
  const sx = fromCheck ? L.check : L.spawn;
  const gy = groundTopAt(sx);
  player = { x: sx * T + 2, y: gy * T - 12, w: 12, h: 12, vx: 0, vy: 0, face: 1, onGround: true,
             coyote: 0, buffer: 0, powered: false, inv: 0, anim: 0 };
  if (fromCheck) {
    // remove enemies that would be behind/at the checkpoint start
    enemies = enemies.filter(e => e.x > sx * T + 6 * T || e.x < sx * T - 2 * T);
  }
  timeLeft = L.time; timeTick = 0; combo = 0;
  cam.x = clampCam(player.x - VW * 0.35);
  skyGrad = null;
  updateHud(true);
}

function spawnEnemy(d) {
  const base = { type: d.type, alive: true, dying: null, dt: 0, active: false, vx: 0, vy: 0, onGround: false, t: Math.random() * 100 };
  if (d.type === 'vac') Object.assign(base, { w: 14, h: 7, vx: -0.55 });
  if (d.type === 'cuc') Object.assign(base, { w: 8, h: 14, hop: 40 + (d.x * 7) % 50 });
  if (d.type === 'pig') Object.assign(base, { w: 12, h: 9, vx: -0.7 });
  base.x = d.x * T + (T - base.w) / 2;
  base.y = (d.y + 1) * T - base.h;
  base.baseY = base.y;
  return base;
}

/* ================= background ================= */
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function genBg(i, W) {
  const r = mulberry(4242 + i * 977);
  const far = [], near = [], clouds = [], stars = [];
  let x = -30;
  while (x < W * T * 0.25 + 520) { const w = 26 + (r() * 40 | 0), h = 46 + (r() * 80 | 0); far.push({ x, w, h, seed: r() * 1e6 | 0 }); x += w + (r() * 8 | 0); }
  x = -30;
  while (x < W * T * 0.5 + 520) { const w = 30 + (r() * 46 | 0), h = 26 + (r() * 60 | 0); near.push({ x, w, h, seed: r() * 1e6 | 0 }); x += w + 6 + (r() * 26 | 0); }
  for (let k = 0; k < 16; k++) clouds.push({ x: r() * (W * T * 0.12 + 600), y: 14 + r() * 60, s: 0.6 + r() * 0.8 });
  for (let k = 0; k < 70; k++) stars.push({ x: r() * 700, y: r() * 120, p: r() * 6.28 });
  return { far, near, clouds, stars };
}
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return (h ^ (h >>> 16)) >>> 0; }

/* ================= audio ================= */
let actx = null, muted = false;
try { muted = localStorage.getItem('nabi-muted') === '1'; } catch (e) {}
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }

// touch: d-pad with finger sliding between halves, separate jump button
(function setupTouch() {
  const dpad = $('dpad'), tl = $('tleft'), tr = $('tright'), jb = $('jumpbtn');
  const fingers = new Map();
  function sync() {
    let l = false, r = false;
    fingers.forEach(side => { if (side < 0) l = true; else if (side > 0) r = true; });
    input.left = l; input.right = r;
    tl.classList.toggle('on', l); tr.classList.toggle('on', r);
  }
  function sideOf(e) { const rc = dpad.getBoundingClientRect(); return e.clientX < rc.left + rc.width / 2 ? -1 : 1; }
  dpad.addEventListener('pointerdown', (e) => { ensureAudio(); e.preventDefault(); try { dpad.setPointerCapture(e.pointerId); } catch (_) {} fingers.set(e.pointerId, sideOf(e)); sync(); });
  dpad.addEventListener('pointermove', (e) => { if (fingers.has(e.pointerId)) { fingers.set(e.pointerId, sideOf(e)); sync(); } });
  const up = (e) => { fingers.delete(e.pointerId); sync(); };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => dpad.addEventListener(n, up));
  const jids = new Set();
  jb.addEventListener('pointerdown', (e) => { ensureAudio(); e.preventDefault(); jids.add(e.pointerId); setJump(true); jb.classList.add('on'); });
  const jup = (e) => { jids.delete(e.pointerId); if (!jids.size) { setJump(false); jb.classList.remove('on'); } };
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => jb.addEventListener(n, jup));
  document.addEventListener('contextmenu', (e) => e.preventDefault());
})();

/* ================= helpers ================= */
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function clampCam(x) { return Math.max(0, Math.min(lvl.W * T - VW, x)); }

function puff(x, y, n, color, spread = 1.2) {

/* ================= physics ================= */
function collideX(o) {
  const top = Math.floor(o.y / T), bot = Math.floor((o.y + o.h - 0.01) / T);
  if (o.vx > 0) {
    const tx = Math.floor((o.x + o.w - 0.01) / T);
    for (let ty = top; ty <= bot; ty++) if (SOLID.has(tile(tx, ty))) { o.x = tx * T - o.w; return 1; }
  } else if (o.vx < 0) {
    const tx = Math.floor(o.x / T);
    for (let ty = top; ty <= bot; ty++) if (SOLID.has(tile(tx, ty))) { o.x = (tx + 1) * T; return -1; }
  }
  return 0;
}
function collideY(o, prevBottom, isPlayer) {
  const l = Math.floor(o.x / T), r = Math.floor((o.x + o.w - 0.01) / T);
  if (o.vy > 0) {
    const ty = Math.floor((o.y + o.h - 0.01) / T);
    for (let tx = l; tx <= r; tx++) {
      const c = tile(tx, ty);
      if (SOLID.has(c) || (c === '-' && prevBottom <= ty * T + 0.5)) { o.y = ty * T - o.h; o.vy = 0; o.onGround = true; return 1; }
    }
  } else if (o.vy < 0) {
    const ty = Math.floor(o.y / T);
    const hits = [];
    for (let tx = l; tx <= r; tx++) if (SOLID.has(tile(tx, ty))) hits.push(tx);
    if (hits.length) {
      if (isPlayer && hits.length === 1) {
        // corner forgiveness: slide past a block edge when barely clipping it
        const tx = hits[0];
        const overL = (o.x + o.w) - tx * T, overR = (tx + 1) * T - o.x;
        if (overL > 0 && overL <= 4 && !SOLID.has(tile(tx - 1, ty))) { o.x = tx * T - o.w; return 0; }
        if (overR > 0 && overR <= 4 && !SOLID.has(tile(tx + 1, ty))) { o.x = (tx + 1) * T; return 0; }
      }
      let best = hits[0], bd = 1e9;
      for (const tx of hits) { const d = Math.abs((tx + 0.5) * T - (o.x + o.w / 2)); if (d < bd) { bd = d; best = tx; } }
      o.y = (ty + 1) * T; o.vy = 0.5;
      if (isPlayer) bumpTile(best, ty);
      return -1;
    }
  }
  return 0;
}

function bumpTile(tx, ty) {
  const c = lvl.g[ty][tx];
  const cx = tx * T + T / 2, cy = ty * T;
  if (c === '?') {
    lvl.g[ty][tx] = 'U'; bumps.set(tx + ',' + ty, 0);
    parts.push({ kind: 'fishpop', x: cx - 5, y: cy - 8, vx: 0, vy: -4.2, g: 0.28, life: 26, t: 0 });
    addFish(1); sfx('fish');
  } else if (c === 'P') {
    lvl.g[ty][tx] = 'U'; bumps.set(tx + ',' + ty, 0);
    items.push({ type: 'nip', x: tx * T + 3, y: ty * T, w: 10, h: 10, vx: 0, vy: 0, emerge: 16, startY: ty * T, onGround: false });
    sfx('sprout');
  } else if (c === 'B') {
    if (player.powered) {
      lvl.g[ty][tx] = ' ';
      for (let i = 0; i < 4; i++) parts.push({ kind: 'chunk', x: tx * T + (i % 2) * 8 + 2, y: ty * T + (i < 2 ? 2 : 9), vx: (i % 2 ? 1.4 : -1.4), vy: i < 2 ? -4.5 : -3, g: 0.3, life: 60, t: 0, c: '#c9965a', s: 5 });
      addScore(50); sfx('brk');
    } else { bumps.set(tx + ',' + ty, 0); sfx('bump'); }
  } else { sfx('bump'); }
  // things standing on the bumped tile get knocked
  const zone = { x: tx * T, y: ty * T - 4, w: T, h: 4 };
  for (const e of enemies) if (e.alive && !e.dying && overlap(e, zone)) killEnemy(e, 'flip');
  for (const it of items) if (overlap(it, zone)) { it.vy = -4; it.vx = -it.vx || 1; }
  if (tile(tx, ty - 1) === 'o') { lvl.g[ty - 1][tx] = ' '; parts.push({ kind: 'fishpop', x: cx - 5, y: cy - 22, vx: 0, vy: -3, g: 0.28, life: 20, t: 0 }); addFish(1); sfx('fish'); }
}

function killEnemy(e, mode) {
  e.dying = mode; e.dt = 0;
  if (mode === 'flip') { e.vy = -3.6; e.vx = (e.x < player.x ? -0.8 : 0.8); }
  addScore(100, e.x, e.y - 6);
}

function hurt() {
  if (player.inv > 0) return;
  if (player.powered) { player.powered = false; player.inv = 110; sfx('hurt'); puff(player.x + 6, player.y + 4, 8, '#7bd35b', 1.5); return; }
  die();
}
function die(splash) {
  if (state !== 'play') return;
  state = 'dying'; stateT = 0;
  player.vx = 0; player.vy = splash ? -3 : -6.2; player.dead = true;
  if (splash) { sfx('splash'); for (let i = 0; i < 14; i++) parts.push({ x: player.x + 6, y: player.y + 10, vx: (Math.random() - 0.5) * 3, vy: -1 - Math.random() * 3, g: 0.2, life: 40, t: 0, c: '#8fd0f5', s: 2 }); }
  sfx('die');

/* ================= update ================= */
function updatePlayer() {
  const p = player;
  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  const max = 2.35;
  if (dir) {
    const acc = p.onGround ? (Math.sign(p.vx) === -dir ? 0.55 : 0.3) : 0.22;
    p.vx += dir * acc;
    if (Math.abs(p.vx) > max) p.vx = Math.sign(p.vx) * max;
    p.face = dir;
    if (p.onGround && Math.sign(p.vx) === -dir && Math.abs(p.vx) > 1.2 && frame % 4 === 0) puff(p.x + 6, p.y + 12, 1, '#e8dccb', 0.6);
  } else {
    p.vx *= p.onGround ? 0.72 : 0.93;
    if (Math.abs(p.vx) < 0.05) p.vx = 0;
  }
  if (input.jumpPressed) p.buffer = 7;
  if (p.onGround) { p.coyote = 6; combo = 0; } else if (p.coyote > 0) p.coyote--;
  if (p.buffer > 0) {
    p.buffer--;
    if (p.coyote > 0) { p.vy = -6.5; p.coyote = 0; p.buffer = 0; p.onGround = false; sfx('jump'); puff(p.x + 6, p.y + 12, 3, '#f2e6d4', 0.8); }
  }
  p.vy = Math.min(p.vy + ((p.vy < 0 && input.jump) ? 0.32 : 0.62), 7);

  p.x += p.vx;
  if (p.x < 0) { p.x = 0; p.vx = 0; }
  if (collideX(p)) p.vx = 0;
  const prevBottom = p.y + p.h, wasGround = p.onGround, fallV = p.vy;
  p.y += p.vy;
  p.onGround = false;
  collideY(p, prevBottom, true);
  if (p.onGround && !wasGround && fallV > 4) puff(p.x + 6, p.y + 12, 4, '#f2e6d4', 0.9);
  p.anim += p.onGround ? Math.abs(p.vx) : 0;
  if (p.inv > 0) p.inv--;

  // collectibles and hazards in overlapped tiles
  const l = Math.floor(p.x / T), r = Math.floor((p.x + p.w - 0.01) / T);
  const t0 = Math.floor(p.y / T), t1 = Math.floor((p.y + p.h - 0.01) / T);
  for (let ty = t0; ty <= t1; ty++) for (let tx = l; tx <= r; tx++) {
    const c = tile(tx, ty);
    if (c === 'o') { lvl.g[ty][tx] = ' '; addFish(1); sfx('fish'); parts.push({ kind: 'spark', x: tx * T + 8, y: ty * T + 8, life: 14, t: 0 }); }
    if (c === 'w' && p.y + p.h > ty * T + 5) { die(true); return; }
  }
  if (p.y > VH + 10) { die(); return; }

  // checkpoint bell
  const L = lvl.def;
  if (!reachedCheck && p.x + p.w > L.check * T + 4) { reachedCheck = true; sfx('bell'); popups.push({ x: L.check * T - 8, y: lvl.checkY * T - 40, text: '딸랑!', t: 0 }); }
  // goal tower
  if (p.x + p.w >= L.goal * T + 2) startClear();
}

function updateEnemies() {
  const p = player;
  for (const e of enemies) {
    if (!e.alive) continue;
    if (!e.active) { if (e.x < cam.x + VW + 24) e.active = true; else continue; }
    e.t++;
    if (e.dying === 'squash') { if (++e.dt > 30) e.alive = false; continue; }
    if (e.dying === 'flip') { e.vy += 0.3; e.x += e.vx; e.y += e.vy; if (e.y > VH + 30) e.alive = false; continue; }

    if (e.type === 'pig') {
      e.x += e.vx; e.y = e.baseY + Math.sin(e.t * 0.06) * 10;
      if (e.x < cam.x - 80) e.alive = false;
    } else {
      if (e.type === 'cuc') {
        if (e.onGround) {
          e.vx = 0;
          const near = Math.abs((p.x + 6) - (e.x + 4)) < 120;
          if (--e.hop <= 0 && near) { e.vy = -4.2; e.vx = Math.sign((p.x + 6) - (e.x + 4)) * 0.5; e.hop = 80 + (Math.random() * 50 | 0); e.onGround = false; }
          if (e.hop < 0) e.hop = 0;
        }
      }
      e.vy = Math.min(e.vy + 0.4, 6);
      const ovx = e.vx;
      e.x += e.vx;
      if (collideX(e)) e.vx = e.type === 'vac' ? -ovx : 0;
      const prevB = e.y + e.h; e.y += e.vy; e.onGround = false; collideY(e, prevB, false);
      if (e.y > VH + 30) { e.alive = false; continue; }
    }

    // vacuums bump into each other
    if (e.type === 'vac') for (const o of enemies) {
      if (o !== e && o.alive && !o.dying && o.type === 'vac' && o.active && overlap(e, o)) {
        if ((e.x < o.x && e.vx > 0) || (e.x > o.x && e.vx < 0)) e.vx = -e.vx;
      }
    }

    if (state === 'play' && !e.dying && overlap(p, e)) {
      const rel = p.vy - (e.vy || 0);
      const fromAbove = p.vy > 0 && rel > -0.5 && (p.y + p.h) - e.y < Math.max(8, rel + 5);
      if (fromAbove) {
        e.dying = e.type === 'pig' ? 'flip' : 'squash'; e.dt = 0;
        if (e.type === 'pig') { e.vy = -1; e.vx = 0; }
        p.y = e.y - p.h;
        p.vy = input.jump ? -6.6 : -4.4;
        const pts = 100 * Math.pow(2, Math.min(combo, 4)); combo++;
        addScore(pts, e.x, e.y - 6); sfx('stomp');
        puff(e.x + e.w / 2, e.y, 5, '#ffffff', 1);

}

function updateItems() {
  for (const it of items) {
    if (it.dead) continue;
    if (it.emerge > 0) { it.emerge--; it.y = it.startY - (16 - it.emerge) * 0.75 - 4; if (it.emerge === 0) it.vx = player.x + 6 < it.x + 5 ? 1 : -1; continue; }
    it.vy = Math.min(it.vy + 0.35, 6);
    const ovx = it.vx; it.x += it.vx; if (collideX(it)) it.vx = -ovx;
    const pb = it.y + it.h; it.y += it.vy; it.onGround = false; collideY(it, pb, false);
    if (it.y > VH + 20) it.dead = true;
    if (overlap(player, it)) {
      it.dead = true;
      if (!player.powered) { player.powered = true; }
      addScore(500, it.x, it.y - 6); sfx('power'); meow(1.15);
      for (let i = 0; i < 14; i++) parts.push({ kind: 'spark', x: player.x + 6 + (Math.random() - 0.5) * 20, y: player.y + 6 + (Math.random() - 0.5) * 20, life: 20 + Math.random() * 10, t: 0 });
    }
  }
  items = items.filter(i => !i.dead);
}

function updateParts() {
  for (const q of parts) { q.t++; if (q.vx !== undefined) { q.vy += q.g || 0; q.x += q.vx; q.y += q.vy; } }
  parts = parts.filter(q => q.t < q.life);
  for (const q of popups) q.t++;
  popups = popups.filter(q => q.t < 45);
  for (const [k, v] of bumps) { if (v >= 10) bumps.delete(k); else bumps.set(k, v + 1); }
}

function updateCamera(snap) {
  const target = clampCam(player.x + player.w / 2 - VW * 0.42);
  cam.x = snap ? target : cam.x + (target - cam.x) * 0.14;
}

function startClear() {
  state = 'clear'; stateT = 0;
  const L = lvl.def;
  player.clearFrom = { x: player.x, y: player.y };
  player.clearTo = { x: L.goal * T + 2, y: lvl.goalY * T - 82 - player.h };
  player.vx = 0; player.vy = 0; player.face = 1;
  sfx('clear'); setTimeout(() => meow(1.05), 450);
}

function step() {
  frame++; stateT++;
  if (state === 'play') {
    updatePlayer();
    if (state === 'play') updateEnemies();
    updateItems();
    updateParts();
    updateCamera(false);
    if (state === 'play' && ++timeTick >= 60) {
      timeTick = 0; timeLeft--;
      if (timeLeft === 50) sfx('hurt');
      if (timeLeft <= 0) { timeLeft = 0; die(); }
    }
  } else if (state === 'intro') {
    updateParts();
    if (stateT > 95) { hide(); overlay.style.pointerEvents = ''; state = 'play'; }
  } else if (state === 'dying') {
    const p = player;
    if (stateT > 28) { p.vy += 0.35; p.y += p.vy; }
    updateParts();
    if (stateT > 130) {
      lives--;
      if (lives <= 0) {
        lives = 0; state = 'gameover'; const nb = saveBest();
        show(`<div class="panel"><p class="eyebrow">아홉 목숨을 모두 썼어요</p><h2>게임 오버</h2>${statsHtml()}
          ${nb ? '<p>새 최고 점수!</p>' : ''}
          <div class="row-btns"><button class="btn" type="button" data-act="start">다시 하기</button><button class="btn ghost" type="button" data-act="title">처음으로</button></div></div>`);
      } else beginLevel(levelIndex, reachedCheck);
    }
  } else if (state === 'clear') {
    const p = player, k = Math.min(1, stateT / 45);
    const e = 1 - Math.pow(1 - k, 2);
    p.x = p.clearFrom.x + (p.clearTo.x - p.clearFrom.x) * e;
    p.y = p.clearFrom.y + (p.clearTo.y - p.clearFrom.y) * e - Math.sin(k * Math.PI) * 30;
    if (stateT === 46) for (let i = 0; i < 16; i++) parts.push({ kind: 'spark', x: p.x + 6 + (Math.random() - 0.5) * 34, y: p.y + (Math.random() - 0.5) * 30, life: 24 + Math.random() * 16, t: 0 });
    if (stateT > 60 && timeLeft > 0) {
      const n = Math.min(timeLeft, 3); timeLeft -= n; score += 10 * n; if (frame % 3 === 0) sfx('tick');
      stateT = 61;
    } else if (stateT > 150) {
      if (levelIndex + 1 < LEVELS.length) { reachedCheck = false; beginLevel(levelIndex + 1, false); }
      else {
        state = 'win'; const nb = saveBest();
        show(`<div class="panel"><p class="eyebrow">캣타워 세 곳 정복</p><h2>나비가 동네 대장이 됐어요</h2>
          <p>남은 목숨 ${lives}개로 모든 동네를 지났어요.</p>${statsHtml()}${nb ? '<p>새 최고 점수!</p>' : ''}
          <div class="row-btns"><button class="btn" type="button" data-act="start">한 번 더</button><button class="btn ghost" type="button" data-act="title">처음으로</button></div></div>`);
      }
    }
    updateParts();
    updateCamera(false);
  } else {
    // title / paused / gameover: keep the world gently alive
    updateParts();
  }
  input.jumpPressed = false;
  updateHud();
}

const C = { line: '#3a2213', fur: '#f39a3b', stripe: '#c9681c', white: '#fff3e2', pink: '#f49aae', eye: '#24180f' };

function drawBackground() {

    const sx = Math.round(b.x - cam.x * 0.22);

    const top = VH - 26 - b.h;
    ctx.fillStyle = th.far; ctx.fillRect(sx, top, b.w, b.h + 26);

    const base = VH - 18;
    ctx.fillStyle = th.near;

      ctx.fillRect(sx + b.w / 2 - 2, base - h * 0.45, 4, h * 0.45 + 20);
      circle(sx + b.w / 2, base - h * 0.55, b.w * 0.42);
      circle(sx + b.w / 2 - b.w * 0.25, base - h * 0.42, b.w * 0.3);
      circle(sx + b.w / 2 + b.w * 0.25, base - h * 0.42, b.w * 0.3);

        ctx.fillStyle = 'rgba(255,215,106,.25)'; circle(lx + 1, base - 56, 9);
        ctx.fillStyle = '#ffd76a'; ctx.fillRect(lx - 2, base - 58, 6, 4);

      ctx.fillRect(sx, top + 12, b.w, b.h);

function drawTiles() {
  const th = lvl.theme;

  const ox = -Math.round(cam.x);
  for (let ty = 0; ty < ROWS; ty++) for (let tx = c0; tx <= c1; tx++) {
    const c = lvl.g[ty][tx];
    if (c === ' ') continue;
    const x = tx * T + ox, y0 = ty * T;
    let y = y0;
    const bk = bumps.get(tx + ',' + ty);
    if (bk !== undefined) y -= Math.round(Math.sin((bk / 10) * Math.PI) * 5);
    switch (c) {
      case '#': drawGround(x, y, tx, ty, th); break;
      case 'H': drawBlock(x, y, th); break;
      case 'B': drawBox(x, y); break;
      case '?': case 'P': drawYarnBox(x, y, tx); break;
      case 'U': drawUsed(x, y); break;
      case '-': drawShelf(x, y, tx, ty); break;
      case 'o': drawFish(x + 3, y + 4 + Math.round(Math.sin(frame * 0.08 + tx * 0.7) * 1.5)); break;

}
function drawGround(x, y, tx, ty, th) {
  ctx.fillStyle = th.dirt; ctx.fillRect(x, y, T, T);

      ctx.fillRect(x + (h % 13), y - 1, 1, 1); ctx.fillRect(x + ((h >> 5) % 13) + 1, y - 2, 1, 2);
      ctx.fillRect(x + ((h >> 3) % 6) * 2, y + 4, 2, 2);

}
function drawBlock(x, y, th) {
  ctx.fillStyle = '#000'; ctx.fillRect(x, y, T, T);
  ctx.fillStyle = th.block; ctx.fillRect(x + 1, y + 1, T - 2, T - 2);

function drawCat(px, py, face, pose, phase, opts = {}) {
  ctx.save();
  ctx.translate(Math.round(px) + (face < 0 ? 16 : 0), Math.round(py) + (opts.flipY ? 14 : 0));
  ctx.scale(face < 0 ? -1 : 1, opts.flipY ? -1 : 1);
  const R = [];
  const a = (x, y, w, h) => R.push(x, y, w, h);
  const sw = Math.round(Math.sin(frame * (pose === 'run' ? 0.3 : 0.1)) * 1);
  const hb = pose === 'run' && phase ? 1 : 0;   // head bob
  // tail
  if (pose === 'run' || pose === 'jump') { a(0, 6, 3, 2); a(-2, 5, 3, 2); a(-3 + sw, 3, 2, 3); }
  else { a(1, 6, 2, 3); a(0, 3, 2, 4); a(1 + sw, 1, 2, 3); }
  // body + head + ears
  a(2, 6, 10, 5);
  a(9, 1 + hb, 7, 6); a(9, -1 + hb, 2, 3); a(14, -1 + hb, 2, 3);
  // legs
  if (pose === 'run') { if (phase) { a(3, 11, 2, 2); a(5, 11, 2, 2); a(8, 11, 2, 2); a(10, 11, 2, 2); } else { a(1, 10, 2, 3); a(4, 11, 2, 2); a(8, 11, 2, 2); a(11, 10, 2, 3); } }
  else if (pose === 'jump') { a(0, 9, 3, 2); a(2, 10, 3, 2); a(10, 10, 3, 2); a(12, 9, 3, 2); }
  else if (pose === 'fall') { a(2, 11, 2, 2); a(5, 11, 2, 2); a(8, 11, 2, 2); a(11, 11, 2, 2); }
  else { a(2, 11, 2, 2); a(5, 11, 2, 2); a(8, 11, 2, 2); a(10, 11, 2, 2); }
  ctx.fillStyle = C.line;
  for (let i = 0; i < R.length; i += 4) ctx.fillRect(R[i] - 1, R[i + 1] - 1, R[i + 2] + 2, R[i + 3] + 2);
  ctx.fillStyle = C.fur;
  for (let i = 0; i < R.length; i += 4) ctx.fillRect(R[i], R[i + 1], R[i + 2], R[i + 3]);
  // markings
  ctx.fillStyle = C.stripe;
  ctx.fillRect(4, 6, 1, 3); ctx.fillRect(6, 6, 1, 2); ctx.fillRect(8, 6, 1, 3);
  ctx.fillRect(12, 1 + hb, 1, 2); ctx.fillRect(10, 1 + hb, 1, 1); ctx.fillRect(14, 1 + hb, 1, 1);
  if (pose === 'run' || pose === 'jump') ctx.fillRect(-2, 5, 1, 2); else ctx.fillRect(0, 4, 2, 1);
  ctx.fillStyle = C.white;
  ctx.fillRect(4, 10, 6, 1); ctx.fillRect(10, 6 + hb, 2, 3);
  ctx.fillRect(12, 4 + hb, 4, 3);
  if (pose === 'run' || pose === 'jump') ctx.fillRect(-3 + sw, 3, 2, 1); else ctx.fillRect(1 + sw, 1, 2, 1);
  ctx.fillStyle = C.pink; ctx.fillRect(10, 0 + hb, 1, 1); ctx.fillRect(14, 0 + hb, 1, 1); ctx.fillRect(14, 4 + hb, 1, 1);
  // eyes
  ctx.fillStyle = C.eye;
  const blink = opts.happy || opts.dead || (frame % 200) < 6;
  if (opts.dead) { ctx.fillRect(11, 2, 1, 1); ctx.fillRect(12, 3, 1, 1); ctx.fillRect(12, 2, 1, 1); ctx.fillRect(11, 3, 1, 1); ctx.fillRect(15, 2, 1, 2); }
  else if (blink) { ctx.fillRect(11, 3 + hb, 2, 1); ctx.fillRect(15, 3 + hb, 1, 1); }
  else { ctx.fillRect(12, 2 + hb, 1, 2); ctx.fillRect(15, 2 + hb, 1, 2); ctx.fillStyle = '#fff'; ctx.fillRect(12, 2 + hb, 1, 1); }
  // whiskers
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(16, 4 + hb, 2, 1); ctx.fillRect(16, 6 + hb, 2, 1);
  // collar + bell when powered
  if (opts.powered) {
    ctx.fillStyle = '#d6283a'; ctx.fillRect(9, 7, 4, 1);
    ctx.fillStyle = '#ffd34a'; ctx.fillRect(11, 8, 2, 2);
    ctx.fillStyle = '#8a5a00'; ctx.fillRect(11, 9, 2, 1);
  }
  ctx.restore();
}

function drawPlayer() {
  const p = player;
  if (p.inv > 0 && Math.floor(p.inv / 3) % 2 === 0 && state === 'play') return;
  let pose = 'idle';
  if (state === 'clear' && stateT > 45) pose = 'idle';
  else if (!p.onGround && state !== 'clear') pose = p.vy < 0 ? 'jump' : 'fall';
  else if (state === 'clear') pose = 'jump';
  else if (Math.abs(p.vx) > 0.3) pose = 'run';
  const phase = Math.floor(p.anim / 7) % 2;
  const sx = p.x - cam.x - 2, sy = p.y - 2;
  if (state === 'dying') { drawCat(sx, sy, p.face, 'fall', 0, { dead: true, flipY: true }); return; }
  if (p.powered && frame % 24 < 2) parts.push({ kind: 'spark', x: p.x + 6 + (Math.random() - 0.5) * 16, y: p.y + (Math.random() - 0.3) * 14, life: 12, t: 0 });
  drawCat(sx, sy, p.face, pose, phase, { powered: p.powered, happy: state === 'clear' && stateT > 45 });
}

function drawEnemy(e) {
  const x = Math.round(e.x - cam.x), y = Math.round(e.y);
  if (x < -30 || x > VW + 30) return;
  if (e.type === 'vac') {
    if (e.dying === 'squash') {
      ctx.fillStyle = '#1f2228'; ctx.fillRect(x, y + 4, 14, 3);
      ctx.fillStyle = '#5b6270'; ctx.fillRect(x + 1, y + 4, 12, 2);
      ctx.fillStyle = '#ff5050'; ctx.fillRect(x + 6, y + 4, 2, 1);
      return;
    }
    ctx.save();
    if (e.dying === 'flip') { ctx.translate(x, y + 7); ctx.scale(1, -1); ctx.translate(-x, -y); }
    ctx.fillStyle = '#1f2228';
    ctx.fillRect(x + 2, y, 10, 1); ctx.fillRect(x, y + 1, 14, 5); ctx.fillRect(x + 1, y + 6, 12, 1);
    ctx.fillStyle = '#5b6270'; ctx.fillRect(x + 1, y + 2, 12, 4);
    ctx.fillStyle = '#8b93a3'; ctx.fillRect(x + 2, y + 1, 10, 2);
    ctx.fillStyle = '#c3c9d4'; ctx.fillRect(x + 4, y + 1, 4, 1);
    const front = e.vx < 0 ? x + 2 : x + 10;
    ctx.fillStyle = (Math.floor(e.t / 15) % 2) ? '#5cff8a' : '#2ea859';
    ctx.fillRect(front, y + 3, 2, 1);
    ctx.fillStyle = '#1f2228'; ctx.fillRect(front + (e.vx < 0 ? -1 : 1), y + 4, 2, 1);
    // spinning side brush
    ctx.fillStyle = '#ffd34a';
    const bx = e.vx < 0 ? x - 1 : x + 13, k = Math.floor(e.t / 3) % 2;
    ctx.fillRect(bx - k, y + 6, 1 + k * 2, 1);
    ctx.restore();
  } else if (e.type === 'cuc') {
    ctx.save();
    if (e.dying === 'squash') { ctx.translate(x, y + e.h); ctx.scale(1.3, 0.35); ctx.translate(-x - 1, -y - e.h); }
    if (e.dying === 'flip') { ctx.translate(x, y + e.h / 2); ctx.scale(1, -1); ctx.translate(-x, -y - e.h / 2); }
    ctx.fillStyle = '#1b3d14'; ctx.fillRect(x + 1, y, 6, 14); ctx.fillRect(x, y + 2, 8, 10);
    ctx.fillStyle = '#4f9d3a'; ctx.fillRect(x + 1, y + 1, 6, 12);
    ctx.fillStyle = '#86c95e'; ctx.fillRect(x + 2, y + 1, 1, 11);
    ctx.fillStyle = '#2d5e22'; ctx.fillRect(x + 5, y + 9, 1, 1); ctx.fillRect(x + 3, y + 11, 1, 1); ctx.fillRect(x + 5, y + 12, 1, 1);
    ctx.fillStyle = '#7a5a20'; ctx.fillRect(x + 3, y - 1, 2, 2);
    const look = (player.x + 6) < (e.x + 4) ? 0 : 1;
    ctx.fillStyle = '#fff'; ctx.fillRect(x + 1, y + 4, 3, 3); ctx.fillRect(x + 4, y + 4, 3, 3);
    ctx.fillStyle = '#000'; ctx.fillRect(x + 1 + look + 1, y + 5, 1, 2); ctx.fillRect(x + 4 + look + 1, y + 5, 1, 2);
    ctx.fillRect(x + 1, y + 3, 2, 1); ctx.fillRect(x + 5, y + 3, 2, 1);
    ctx.fillRect(x + 3, y + 8, 2, 1);
    ctx.restore();
  } else if (e.type === 'pig') {
    ctx.save();
    if (e.dying) { ctx.translate(x, y + 4); ctx.scale(1, -1); ctx.translate(-x, -y - 4); }
    const flap = Math.floor(e.t / 6) % 2;
    ctx.fillStyle = '#2e3341';
    ctx.fillRect(x + 1, y + 3, 10, 5); ctx.fillRect(x, y + 1, 4, 4); ctx.fillRect(x + 10, y + 4, 2, 2);
    ctx.fillStyle = '#9aa3b5'; ctx.fillRect(x + 2, y + 4, 8, 3); ctx.fillRect(x + 1, y + 2, 2, 2);
    ctx.fillStyle = '#6fbf9a'; ctx.fillRect(x + 2, y + 3, 2, 2);
    ctx.fillStyle = '#e8b04a'; ctx.fillRect(x - 1, y + 3, 1, 1);
    ctx.fillStyle = '#ff7a3a'; ctx.fillRect(x + 1, y + 2, 1, 1);
    ctx.fillStyle = '#2e3341';
    if (flap) { ctx.fillRect(x + 4, y - 1, 5, 4); ctx.fillStyle = '#c3cad8'; ctx.fillRect(x + 5, y, 3, 3); }
    else { ctx.fillRect(x + 4, y + 5, 5, 4); ctx.fillStyle = '#c3cad8'; ctx.fillRect(x + 5, y + 6, 3, 2); }
    ctx.restore();
  }
}

function drawCheckpoint() {
  const L = lvl.def;
  const x = Math.round(L.check * T - cam.x) + 4, gy = lvl.checkY * T;
  if (x < -20 || x > VW + 20) return;
  ctx.fillStyle = '#3d2610'; ctx.fillRect(x + 3, gy - 30, 3, 30); ctx.fillRect(x - 1, gy - 2, 11, 2);
  ctx.fillStyle = '#8a5a30'; ctx.fillRect(x + 4, gy - 30, 1, 28);
  ctx.fillStyle = '#3d2610'; ctx.fillRect(x + 4, gy - 34, 9, 2); ctx.fillRect(x + 11, gy - 32, 1, 3);
  const sway = reachedCheck ? Math.round(Math.sin(frame * 0.15) * 1) : 0;
  ctx.fillStyle = reachedCheck ? '#d6283a' : '#7a7a7a'; ctx.fillRect(x + 9 + sway, gy - 29, 5, 2);
  ctx.fillStyle = '#3a2a00'; ctx.fillRect(x + 8 + sway, gy - 27, 7, 7);
  ctx.fillStyle = reachedCheck ? '#ffd34a' : '#b9b9b9'; ctx.fillRect(x + 9 + sway, gy - 26, 5, 5);
  ctx.fillStyle = reachedCheck ? '#fff3b0' : '#e0e0e0'; ctx.fillRect(x + 10 + sway, gy - 25, 1, 1);
  ctx.fillStyle = '#3a2a00'; ctx.fillRect(x + 10 + sway, gy - 23, 3, 1);
}

function drawTower() {
  const L = lvl.def;
  const x = Math.round(L.goal * T - cam.x), gy = lvl.goalY * T;
  if (x < -60 || x > VW + 60) return;
  const line = '#2a1a10';
  // base
  ctx.fillStyle = line; ctx.fillRect(x - 10, gy - 6, 36, 6);
  ctx.fillStyle = '#9b86d1'; ctx.fillRect(x - 9, gy - 5, 34, 4);
  // posts (sisal rope)
  ctx.fillStyle = line; ctx.fillRect(x + 4, gy - 84, 8, 80); ctx.fillRect(x + 18, gy - 46, 6, 42);
  ctx.fillStyle = '#d9b98a'; ctx.fillRect(x + 5, gy - 84, 6, 80); ctx.fillRect(x + 19, gy - 46, 4, 42);
  ctx.fillStyle = '#b48f5f';
  for (let yy = gy - 82; yy < gy - 6; yy += 3) ctx.fillRect(x + 5, yy, 6, 1);
  for (let yy = gy - 44; yy < gy - 6; yy += 3) ctx.fillRect(x + 19, yy, 4, 1);
  // middle platform + hanging toy
  ctx.fillStyle = line; ctx.fillRect(x - 6, gy - 50, 34, 6);
  ctx.fillStyle = '#9b86d1'; ctx.fillRect(x - 5, gy - 49, 32, 4);
  ctx.fillStyle = '#c9bbef'; ctx.fillRect(x - 5, gy - 49, 32, 1);
  const swing = Math.sin(frame * 0.05) * 3;
  ctx.fillStyle = line; ctx.fillRect(Math.round(x - 3 + swing / 2), gy - 44, 1, 12);
  ctx.fillStyle = '#e2505f'; circle(x - 3 + swing, gy - 30, 3.2);
  // top cushion
  ctx.fillStyle = line; ctx.fillRect(x - 4, gy - 90, 24, 8);
  ctx.fillStyle = '#9b86d1'; ctx.fillRect(x - 3, gy - 89, 22, 6);
  ctx.fillStyle = '#c9bbef'; ctx.fillRect(x - 3, gy - 89, 22, 2);
  // pennant
  ctx.fillStyle = line; ctx.fillRect(x + 22, gy - 106, 1, 18);
  ctx.fillStyle = '#ffd34a'; ctx.fillRect(x + 23, gy - 106, 8, 5); ctx.fillRect(x + 23, gy - 101, 4, 2);
}

function drawParts() {
  for (const q of parts) {
    const x = Math.round(q.x - cam.x), y = Math.round(q.y);
    if (q.kind === 'fishpop') { drawFish(x, y); continue; }
    if (q.kind === 'spark') {
      const k = q.t / q.life, s = k < 0.5 ? 1 : 0;
      ctx.fillStyle = k < 0.5 ? '#fff6b0' : '#ffd34a';
      ctx.fillRect(x - 2 - s, y, 5 + s * 2, 1); ctx.fillRect(x, y - 2 - s, 1, 5 + s * 2);
      continue;
    }
    if (q.kind === 'chunk') { ctx.fillStyle = '#3d2610'; ctx.fillRect(x - 1, y - 1, q.s + 2, q.s + 2); ctx.fillStyle = q.c; ctx.fillRect(x, y, q.s, q.s); continue; }
    ctx.globalAlpha = 1 - q.t / q.life;
    ctx.fillStyle = q.c; ctx.fillRect(x, y, q.s, q.s);
    ctx.globalAlpha = 1;
  }
  ctx.font = 'bold 8px monospace'; ctx.textAlign = 'center';
  for (const q of popups) {
    const x = Math.round(q.x - cam.x + 6), y = Math.round(q.y - q.t * 0.5);
    ctx.fillStyle = '#000'; ctx.fillText(q.text, x + 1, y + 1);
    ctx.fillStyle = q.big ? '#7dff8a' : '#fff'; ctx.fillText(q.text, x, y);
  }
}

function render() {
  if (!lvl) return;
  ctx.imageSmoothingEnabled = false;
  drawBackground();
  drawCheckpoint();
  drawTower();
  drawTiles();
  for (const it of items) drawCatnip(Math.round(it.x - cam.x), Math.round(it.y));
  for (const e of enemies) if (e.alive && e.active) drawEnemy(e);
  if (state !== 'title') drawPlayer();
  else {
    // title attract: Nabi sits on the yarn box row and looks around
    const p = player;
    drawCat(p.x - cam.x - 2, p.y - 2, Math.floor(frame / 150) % 2 ? -1 : 1, 'idle', 0, {});
  }
  drawParts();
  if (state === 'dying' && stateT > 100) { ctx.fillStyle = `rgba(0,0,0,${(stateT - 100) / 30})`; ctx.fillRect(0, 0, VW, VH); }
}

/* ================= sizing ================= */
function resize() {
  const touchOn = isTouch;
  $('touch').hidden = !touchOn;
  const portrait = innerHeight > innerWidth;
  const reserve = touchOn && portrait ? 190 : 0;
  app.style.paddingBottom = `calc(env(safe-area-inset-bottom, 0px) + ${reserve}px)`;
  const cs = getComputedStyle(app);
  const aw = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  VW = Math.max(256, Math.min(448, Math.round((VH * aw / Math.max(1, ah)) / 2) * 2));
  cv.width = VW; cv.height = VH;
  const s = Math.max(0.5, Math.min(aw / VW, ah / VH));
  stage.style.width = Math.floor(VW * s) + 'px';
  stage.style.height = Math.floor(VH * s) + 'px';
  document.documentElement.style.setProperty('--s', s.toFixed(3));
  skyGrad = null;
  if (lvl) cam.x = clampCam(cam.x);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));

/* ================= loop ================= */
let last = 0, acc = 0;
const STEP = 1000 / 60;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!last) last = ts;
  acc += Math.min(100, ts - last); last = ts;
  let n = 0;
  while (acc >= STEP && n < 5) { step(); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  render();
}

/* ================= boot ================= */
function start(data) {
  resize();
  if (data && typeof data.level === 'number' && data.lives > 0 && data.state && data.state !== 'title') {
    lives = data.lives; fish = data.fish || 0; score = data.score || 0;
    beginLevel(Math.min(LEVELS.length - 1, data.level), false);
  } else toTitle();
  requestAnimationFrame(loop);
}
try { window.claude?.hot?.snapshot?.(() => ({ level: levelIndex, lives, fish, score, state })); } catch (e) {}
const hot = window.claude?.hot;
if (hot?.ready) hot.ready(start); else start(hot?.data ?? {});

// small handle for automated checks
window.__nabi = { get state() { return state; }, get player() { return player; }, get level() { return levelIndex; }, get cam() { return cam; }, get lvl() { return lvl; }, get enemies() { return enemies; }, get lives() { return lives; }, input, loadLevel: (i) => beginLevel(i, false) };
})();
</script>
