<!doctype html>

<title>Two Storms HD — renderer</title>

<canvas id="cv"></canvas>
<script>
/* =====================================================================
   Two Storms HD — offline renderer.
   Every frame is painted in code (Canvas 2D) as a pure function of time,
   with expensive passes that only make sense offline: motion blur by
   sub-frame averaging, bloom, depth-of-field blur, rim light, paper
   texture and grading. Sound is synthesized with an OfflineAudioContext.
   src/render.mjs drives this page frame by frame and encodes the MP4.
   ===================================================================== */
'use strict';
var W=1920,H=1040,FPS=24,DUR=32,D=Math.PI/180,TAU=Math.PI*2,INK='#2a1d26';
function clamp(x,a,b){return x<a?a:x>b?b:x}
function lerp(a,b,t){return a+(b-a)*t}
function sm(t){t=clamp(t,0,1);return t*t*(3-2*t)}
function eio(t){t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function eout(t){t=clamp(t,0,1);return 1-Math.pow(1-t,3)}
function ein(t){t=clamp(t,0,1);return t*t*t}
function pr(t,a,b){return clamp((t-a)/(b-a),0,1)}
function hash(n){var s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function nz(x){var i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u)*2-1}
function RNG(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)|0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function h2(x,y){var n=(Math.imul(x,374761393)+Math.imul(y,668265263))|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296}
function vn(x,y){var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return lerp(lerp(h2(xi,yi),h2(xi+1,yi),u),lerp(h2(xi,yi+1),h2(xi+1,yi+1),u),v)}
function fbm(x,y,o){var s=0,a=.5,f=1;for(var i=0;i<o;i++){s+=a*vn(x*f,y*f);f*=2.03;a*=.5}return s}
function mk(w,h){var c=document.createElement('canvas');c.width=Math.ceil(w);c.height=Math.ceil(h);return c}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,Math.max(0,r),0,TAU)}
function hex(c){var n=parseInt(c.slice(1),16);return[n>>16,(n>>8)&255,n&255]}
function mixc(a,b,t,al){var A=hex(a),B=hex(b);return'rgba('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+','+(al==null?1:al)+')'}
function rgba(c,a){var A=hex(c);return'rgba('+A[0]+','+A[1]+','+A[2]+','+a+')'}
function star(g,x,y,R,r,n,rot){g.beginPath();for(var i=0;i<n*2;i++){var a=rot+i*Math.PI/n,rr=i%2?r:R;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath()}
function blurred(src,px){var c=mk(src.width,src.height),g=c.getContext('2d');g.filter='blur('+px+'px)';g.drawImage(src,0,0);g.filter='none';return c}

/* ------------------------------------------------------------- buffers */
var CV=document.getElementById('cv');CV.width=W;CV.height=H;var MG=CV.getContext('2d');
var SC=mk(W,H),SG=SC.getContext('2d'),ACC=mk(W,H),AG=ACC.getContext('2d');
var FIG=mk(W,H),FG=FIG.getContext('2d'),RIM=mk(W,H),RG=RIM.getContext('2d');
var BL=mk(W/4,H/4),BG=BL.getContext('2d'),SMK=mk(W,H);

/* ------------------------------------------------------------- figures */
var HERO={hair:'#f3c548',hairS:'#c4832a',hairH:'#fff2b8',skin:'#f6d5b6',skinS:'#d9a385',jacket:'#2d80ba',jacketS:'#1b4f7a',pants:'#2a3352',pantsS:'#171d33',belt:'#ece5d2',shoe:'#2a2830',scarf:'#e2473b',scarfS:'#9f2a24',band:'#273046',plate:'#d8dee6',eye:'#2f8fe0',type:0};
var RIVAL={hair:'#272b3f',hairS:'#11131c',hairH:'#646c8e',skin:'#f1d9c4',skinS:'#c8a18a',jacket:'#35344c',jacketS:'#1e1d2d',pants:'#2a2939',pantsS:'#15141e',belt:'#7d5bd6',shoe:'#22212b',coat:'#2c2b42',coatS:'#17162a',band:'#273046',plate:'#d8dee6',eye:'#6a49c4',type:1};
var KEYS=['torso','head','aFu','aFl','aNu','aNl','lFu','lFl','lNu','lNl'];
var POSE={
 stand:{torso:2,head:0,aFu:-10,aFl:-4,aNu:12,aNl:22,lFu:-8,lFl:-4,lNu:9,lNl:3},

 ready:{torso:14,head:-10,aFu:45,aFl:125,aNu:70,aNl:150,lFu:-28,lFl:-8,lNu:32,lNl:-4},
 crouch:{torso:40,head:-30,aFu:-40,aFl:-12,aNu:-30,aNl:-8,lFu:12,lFl:-78,lNu:80,lNl:-40},

 chargeW:{torso:14,head:-10,aFu:62,aFl:98,aNu:80,aNl:72,lFu:-36,lFl:-18,lNu:46,lNl:-12},
 chargeL:{torso:16,head:-14,aFu:38,aFl:85,aNu:24,aNl:58,lFu:-40,lFl:-22,lNu:50,lNl:-10},
 strike:{torso:30,head:-22,aFu:-80,aFl:-100,aNu:88,aNl:88,lFu:-45,lFl:-30,lNu:55,lNl:5}
};
function mix(a,b,t){var o={};for(var i=0;i<KEYS.length;i++){var k=KEYS[i];o[k]=lerp(a[k]||0,b[k]||0,t)}return o}
function over(a,b){var o={},k;for(k in a)o[k]=a[k];for(k in b)o[k]=b[k];return o}
function runP(ph,lean){function leg(p){var s=Math.sin(p),c=Math.cos(p),u=14+50*s;return[u,u-(52+44*c)]}var s=Math.sin(ph),n=leg(ph),f=leg(ph+Math.PI);
 return{torso:lean,head:-lean*.72,aFu:-112+7*s,aFl:-98+7*s,aNu:-118-7*s,aNl:-104-7*s,lNu:n[0],lNl:n[1],lFu:f[0],lFl:f[1]}}
var SEG={tor:46,neck:56,au:26,al:25,lu:34,ll:35};
function rig(P){var L=P.torso*D,ux=Math.sin(L),uy=-Math.cos(L),sh={x:ux*SEG.tor,y:uy*SEG.tor},nk={x:ux*SEG.neck,y:uy*SEG.neck},ha=L+(P.head||0)*D;
 function lim(b,a1,a2,l1,l2){var p1={x:b.x+Math.sin(a1*D)*l1,y:b.y+Math.cos(a1*D)*l1};return[b,p1,{x:p1.x+Math.sin(a2*D)*l2,y:p1.y+Math.cos(a2*D)*l2}]}
 return{L:L,ux:ux,uy:uy,sh:sh,nk:nk,ha:ha,hd:{x:nk.x+Math.sin(ha)*13,y:nk.y-Math.cos(ha)*13},
  aF:lim({x:sh.x-3,y:sh.y+1},P.aFu,P.aFl,SEG.au,SEG.al),aN:lim(sh,P.aNu,P.aNl,SEG.au,SEG.al),lF:lim({x:-3,y:0},P.lFu,P.lFl,SEG.lu,SEG.ll),lN:lim({x:3,y:0},P.lNu,P.lNl,SEG.lu,SEG.ll)}}
function legExt(R){return Math.max(R.lF[2].y,R.lN[2].y)+5}
function capsule(P,a,b,r1,r2){var an=Math.atan2(b.y-a.y,b.x-a.x);P.moveTo(a.x+Math.cos(an+Math.PI/2)*r1,a.y+Math.sin(an+Math.PI/2)*r1);P.arc(a.x,a.y,r1,an+Math.PI/2,an-Math.PI/2+TAU);P.arc(b.x,b.y,r2,an-Math.PI/2,an+Math.PI/2);P.closePath()}
function limbPath(L,r0,r1,r2){var P=new Path2D();capsule(P,L[0],L[1],r0,r1);capsule(P,L[1],L[2],r1*.98,r2);return P}
function footPath(L,r){var p1=L[1],p2=L[2],dx=p2.x-p1.x,dy=p2.y-p1.y,l=Math.hypot(dx,dy)||1,fx=dy/l,fy=-dx/l,P=new Path2D();capsule(P,{x:p2.x-fx*3,y:p2.y-fy*3},{x:p2.x+fx*11,y:p2.y+fy*11+1},r,r*.8);return P}
function ribbon(pts,w0,w1){var P=new Path2D(),L=[],R=[],n=pts.length;for(var i=0;i<n;i++){var a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,w=lerp(w0,w1,i/(n-1))/2;L.push([pts[i][0]-dy/l*w,pts[i][1]+dx/l*w]);R.push([pts[i][0]+dy/l*w,pts[i][1]-dx/l*w])}
 P.moveTo(L[0][0],L[0][1]);for(i=1;i<n;i++)P.lineTo(L[i][0],L[i][1]);for(i=n-1;i>=0;i--)P.lineTo(R[i][0],R[i][1]);P.closePath();return P}
function hairPath(type,r){var P=new Path2D(),a0,a1,n,i;if(type===0){a0=-.3;a1=-3.35;n=8}else{a0=-.55;a1=-3.25;n=7}

 for(i=0;i<n;i++){var u=(i+.5)/n,at,rt;if(type===0){at=lerp(a0,a1,u)-.14;rt=1.5+.14*Math.sin(i*2.3)}else{at=lerp(a0,a1,u)-.42*u-.1;rt=1.2+.66*u}
  var av0=lerp(a0,a1,i/n),av=lerp(a0,a1,(i+1)/n);P.quadraticCurveTo(Math.cos((av0+at)/2)*1.2*r,Math.sin((av0+at)/2)*1.2*r,Math.cos(at)*rt*r,Math.sin(at)*rt*r);P.quadraticCurveTo(Math.cos((av+at)/2)*1.12*r,Math.sin((av+at)/2)*1.12*r,Math.cos(av)*.92*r,Math.sin(av)*.92*r)}
 P.lineTo(-.96*r,.3*r);P.lineTo(-.35*r,-.42*r);P.lineTo(.62*r,-.52*r);P.closePath();return P}
function bangsPath(type,r){var P=new Path2D();if(type===0){P.moveTo(.08*r,-.6*r);P.lineTo(.24*r,-.18*r);P.lineTo(.4*r,-.55*r);P.lineTo(.52*r,-.26*r);P.lineTo(.66*r,-.56*r);P.closePath()}else{P.moveTo(.62*r,-.64*r);P.quadraticCurveTo(1.0*r,-.1*r,1.04*r,.5*r);P.lineTo(.86*r,0);P.lineTo(.4*r,-.5*r);P.closePath()}return P}
function shift(P,dx,dy){var M=new Path2D();M.addPath(P,new DOMMatrix([1,0,0,1,dx,dy]));return M}

// o: x,y(feet unless gnd:false) s face rot t light{x,y} rim(color) rimW wind amb sil alpha calm hide
function figure(g,ch,P,o){
 var R=rig(P),s=o.s||1,f=o.face||1,rot=o.rot||0,t=o.t||0,w=o.wind==null?1:o.wind;
 var hipY=o.gnd===false?o.y:o.y-legExt(R)*s,cs=Math.cos(rot),sn=Math.sin(rot);
 function W2(p){var lx=p.x*s*f,ly=p.y*s;return[o.x+lx*cs-ly*sn,hipY+lx*sn+ly*cs]}
 var out={hand:W2(R.aN[2]),handF:W2(R.aF[2]),head:W2(R.hd),hip:[o.x,hipY],foot:W2(R.lN[2]),footF:W2(R.lF[2]),chest:W2(R.sh)};
 if(o.hide)return out;
 var lt=o.light||{x:.6,y:-.8},llx=(lt.x*cs+lt.y*sn)*f,lly=-lt.x*sn+lt.y*cs; // light in local space
 var lw=clamp(3.4/s,1.1,2.6),S=o.sil;
 FG.setTransform(1,0,0,1,0,0);FG.clearRect(0,0,W,H);var GT=g.getTransform(),gsc=Math.hypot(GT.a,GT.b);FG.setTransform(GT);
 var g2=FG;g2.save();g2.translate(o.x,hipY);g2.rotate(rot);g2.scale(s*f,s);g2.lineJoin='round';g2.lineCap='round';
 function part(Pa,base,shade,d){g2.strokeStyle=S||INK;g2.lineWidth=lw*2;g2.stroke(Pa);g2.fillStyle=S||base;g2.fill(Pa);
  if(!S&&shade){g2.save();g2.clip(Pa);g2.fillStyle=shade;g2.fill(Pa);g2.fillStyle=base;g2.fill(shift(Pa,llx*(d||4),lly*(d||4)));g2.restore()}}
 function c(k){return ch[k]}
 // far side
 part(limbPath(R.lF,8.6,7.2,5.6),c('pantsS'),mixc(c('pantsS'),'#000000',.3),4);part(footPath(R.lF,4.6),c('shoe'),null);
 part(limbPath(R.aF,6.6,5.6,4.6),c('jacketS'),mixc(c('jacketS'),'#000000',.3),3);var hf=new Path2D();hf.arc(R.aF[2].x,R.aF[2].y,5,0,TAU);part(hf,c('skinS'),null);
 // back cloth
 var wd=o.windDir||-1;
 if(ch.scarf&&!o.calm){for(var k=0;k<2;k++){var pts=[],len=58+k*18,n=10;for(var i=0;i<=n;i++){var u=i/n;pts.push([R.nk.x-3+wd*-1*-len*u,R.nk.y+5+u*(10+k*8)+Math.sin(t*12-u*5+k*1.7)*u*14*w])}
   part(ribbon(pts,10-k*1.5,6-k*2),c('scarf'),c('scarfS'),3)}}
 var px=-R.uy,py=R.ux;
 if(ch.coat&&!o.calm){var CP=new Path2D(),fl=Math.sin(t*10)*w,fl2=Math.sin(t*10+1.4)*w;CP.moveTo(-px*11+R.ux*16,-py*11+R.uy*16);CP.lineTo(-px*13,-py*13);
  CP.bezierCurveTo(-22-8*fl,20,-28-12*fl2,40,-40-16*fl2-8*w,58+6*fl);CP.lineTo(-24-10*fl,52+4*fl2);CP.lineTo(-8-6*fl,56);CP.lineTo(px*9,py*9+10);CP.closePath();part(CP,c('coat'),c('coatS'),5)}
 // torso
 var TP=new Path2D();TP.moveTo(-px*12,-py*12);TP.quadraticCurveTo(0,4,px*12,py*12);TP.quadraticCurveTo(R.sh.x*.5+px*15,R.sh.y*.5+py*15,R.sh.x+px*14.5,R.sh.y+py*14.5);
 TP.quadraticCurveTo(R.sh.x+R.ux*6,R.sh.y+R.uy*6,R.sh.x-px*14.5,R.sh.y-py*14.5);TP.quadraticCurveTo(R.sh.x*.5-px*14,R.sh.y*.5-py*14,-px*12,-py*12);TP.closePath();
 part(TP,c('jacket'),c('jacketS'),6);
 if(!S){g2.save();g2.clip(TP);g2.lineWidth=1.4;if(ch.type===0){g2.strokeStyle='rgba(255,255,255,.55)';g2.beginPath();g2.moveTo(px*3+R.ux*6,py*3+R.uy*6);g2.lineTo(R.sh.x+px*4,R.sh.y+py*4);g2.stroke()}
  else{g2.strokeStyle='#d8d2ea';g2.lineWidth=3;g2.beginPath();g2.moveTo(R.sh.x+px*13,R.sh.y+py*13);g2.lineTo(px*5+R.ux*12,py*5+R.uy*12);g2.stroke()}g2.restore()}
 var BP=new Path2D();capsule(BP,{x:-px*12+R.ux*5,y:-py*12+R.uy*5},{x:px*12+R.ux*5,y:py*12+R.uy*5},3,3);part(BP,c('belt'),null);
 var NP=new Path2D();capsule(NP,R.nk,R.sh,4.5,5);part(NP,c('skin'),c('skinS'),3);
 // near leg
 part(limbPath(R.lN,9,7.6,5.8),c('pants'),c('pantsS'),4);part(footPath(R.lN,4.8),c('shoe'),null);
 // head
 g2.save();g2.translate(R.hd.x,R.hd.y);g2.rotate(R.ha);g2.scale(1.12,1.12);var hr=15;
 if(!o.calm)for(k=0;k<2;k++){var tp=[],tn=6;for(i=0;i<=tn;i++){u=i/tn;tp.push([-13-u*(24+k*6),-4+u*(6+k*5)+Math.sin(t*13-u*4+k)*u*7*w])}part(ribbon(tp,3.6,2.4),c('band'),null)}
 var HP=new Path2D();HP.arc(0,0,hr,0,TAU);part(HP,c('skin'),c('skinS'),3.5);
 var HR=hairPath(ch.type,hr);g2.strokeStyle=S||INK;g2.lineWidth=lw*2;g2.stroke(HR);
 if(S){g2.fillStyle=S;g2.fill(HR)}else{var hg=g2.createLinearGradient(0,-hr*1.6,0,hr*.4);hg.addColorStop(0,c('hair'));hg.addColorStop(1,c('hairS'));g2.fillStyle=hg;g2.fill(HR);
  g2.save();g2.clip(HR);g2.fillStyle=c('hairS');g2.fill(shift(HR,llx*-0,lly*0));g2.fillStyle=hg;g2.fill(shift(HR,llx*4,lly*4));g2.strokeStyle=c('hairH');g2.globalAlpha=.7;g2.lineWidth=2;g2.beginPath();g2.arc(0,-2,hr*1.05,-2.3,-1.2);g2.stroke();g2.restore()}
 g2.strokeStyle=S||c('band');g2.lineWidth=6;g2.beginPath();g2.moveTo(-14,-4);g2.lineTo(14,-7.5);g2.stroke();
 var PP=new Path2D();PP.rect(4,-11.5,10.5,8);part(PP,c('plate'),null);
 if(!S){g2.strokeStyle='#59606e';g2.lineWidth=1.1;g2.beginPath();g2.moveTo(6.5,-5.5);g2.lineTo(9.2,-9.5);g2.lineTo(12,-5.5);g2.stroke()}
 var BG2=bangsPath(ch.type,hr);g2.strokeStyle=S||INK;g2.lineWidth=lw*1.6;g2.stroke(BG2);g2.fillStyle=S||c('hair');g2.fill(BG2);
 if(!S){var ey=ch.type?1.6:1.2,eh=ch.type?2.8:3.8;g2.fillStyle='#fffaf2';g2.beginPath();g2.ellipse(9.3,ey,3.1,eh,0,0,TAU);g2.fill();g2.fillStyle=ch.type?'#5b3fb0':'#2a86dc';g2.beginPath();g2.ellipse(10.3,ey+.3,2,eh*.78,0,0,TAU);g2.fill();g2.fillStyle=INK;g2.beginPath();g2.ellipse(10.6,ey+.4,1,eh*.45,0,0,TAU);g2.fill();g2.fillStyle='#fff';g2.beginPath();g2.arc(10.9,ey-eh*.35,.75,0,TAU);g2.fill();
  g2.strokeStyle=INK;g2.lineWidth=1.7;g2.beginPath();g2.moveTo(6,ey-eh*.55);g2.quadraticCurveTo(9.4,ey-eh*1.2,12.8,ey-eh*.65);g2.stroke();g2.lineWidth=1.8;g2.beginPath();g2.moveTo(6.2,ey-eh-2.4);g2.lineTo(12.6,ey-eh-1.4+(ch.type?1.2:-.8));g2.stroke();
  g2.lineWidth=1;g2.beginPath();g2.moveTo(9.5,8.6);g2.lineTo(12.6,8.2);g2.stroke()}
 g2.restore();
 // near arm
 part(limbPath(R.aN,7,6,5),c('jacket'),c('jacketS'),3);var hn=new Path2D();hn.arc(R.aN[2].x,R.aN[2].y,5.6,0,TAU);part(hn,c('skin'),c('skinS'),2.5);
 g2.restore();
 // rim light: silhouette edge facing the light source(s)

  for(var q=0;q<rims.length;q++){var rm=rims[q];RG.setTransform(1,0,0,1,0,0);RG.globalCompositeOperation='source-over';RG.clearRect(0,0,W,H);RG.drawImage(FIG,0,0);

 g.save();g.setTransform(1,0,0,1,0,0);if(o.alpha!=null)g.globalAlpha*=o.alpha;if(o.blur)g.filter='blur('+o.blur+'px)';g.drawImage(FIG,0,0);g.restore();
 return out}

 for(t=15.5;t<21;t+=t<18?1:(t<20?.5:.25))taiko(t,.6+(t-15)*.06);

 tone(25.8,{f:200,f2:60,dur:1.4,att:1.1,rel:.1,vol:.2});hiss(25.8,{f:3000,f2:300,q:1,dur:1.4,att:1.2,rel:.1,vol:.25});
 windAmb(27,5,.1);pad(27,[-12,-5,0],5,1.1);[[7,27.6,1.2],[8,28.8,.4],[7,29.2,.4],[5,29.6,1],[0,30.6,1.4]].forEach(function(n){flute(n[1],n[0],n[2])});taiko(28.4,.5);taiko(31,.4)}

function wavB64(buf){var ch=buf.numberOfChannels,len=buf.length,sr=buf.sampleRate,data=new DataView(new ArrayBuffer(44+len*ch*2));
 function ws(o,s){for(var i=0;i<s.length;i++)data.setUint8(o+i,s.charCodeAt(i))}ws(0,'RIFF');data.setUint32(4,36+len*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');data.setUint32(16,16,true);data.setUint16(20,1,true);data.setUint16(22,ch,true);data.setUint32(24,sr,true);data.setUint32(28,sr*ch*2,true);data.setUint16(32,ch*2,true);data.setUint16(34,16,true);ws(36,'data');data.setUint32(40,len*ch*2,true);
 var cd=[];for(var c=0;c<ch;c++)cd.push(buf.getChannelData(c));var o=44;for(var i=0;i<len;i++)for(c=0;c<ch;c++){var v=clamp(cd[c][i],-1,1);data.setInt16(o,v<0?v*32768:v*32767,true);o+=2}
 var bytes=new Uint8Array(data.buffer),s='',CH=0x8000;for(i=0;i<bytes.length;i+=CH)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));return btoa(s)}
