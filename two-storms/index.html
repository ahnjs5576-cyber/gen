<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Storms</title>
<meta name="description" content="80초 애니메이션 단편: 바람의 구슬과 번개의 손을 쓰는 두 닌자가 대낮의 도시와 숲을 오가며 싸운다. 그림, 움직임, 소리 모두 코드로 생성.">
<style>
:root{--ink:#f3ead8;--dim:rgba(243,234,216,.62);--line:rgba(243,234,216,.28);--bg:#07060a;--accent:#7cc6ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#frame{position:relative;width:min(100vw,calc(100vh * 1.8462));width:min(100dvw,calc(100dvh * 1.8462));aspect-ratio:1920/1040;background:#000;overflow:hidden;cursor:pointer}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#grain{position:absolute;inset:-4px;pointer-events:none;opacity:.05;mix-blend-mode:overlay}
.fade{transition:opacity .5s ease}
#veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:16px;background:radial-gradient(ellipse at center,rgba(7,6,10,.15),rgba(7,6,10,.55))}
#veil[hidden]{display:none}
h1{margin:0;font-weight:400;font-size:clamp(24px,4.6vw,54px);letter-spacing:.09em;text-shadow:0 2px 24px rgba(0,0,0,.65)}
button{font:inherit;color:var(--ink);background:rgba(10,9,14,.46);border:1px solid var(--line);border-radius:999px;padding:11px 24px;font-size:clamp(14px,1.5vw,17px);letter-spacing:.06em;cursor:pointer;min-height:44px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .2s,border-color .2s}
button:hover{background:rgba(124,198,255,.18);border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#sound{position:absolute;right:clamp(10px,2vw,24px);top:clamp(10px,2vw,24px);opacity:0;pointer-events:none}
#sound.on{opacity:1;pointer-events:auto}
#bar{position:absolute;left:0;right:0;bottom:0;padding:26px clamp(10px,2vw,22px) 12px;display:flex;align-items:center;gap:14px;background:linear-gradient(transparent,rgba(5,4,8,.62));opacity:0}
#frame.show #bar{opacity:1}
#track{flex:1;height:18px;display:flex;align-items:center;cursor:pointer;touch-action:none}
#rail{position:relative;width:100%;height:2px;background:var(--line);border-radius:2px}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:2px}
#time{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:84px;text-align:right}
.ic{padding:0;width:40px;height:40px;min-height:40px;flex:none;display:grid;place-items:center;background:transparent;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.ic svg{width:20px;height:20px;fill:var(--ink)}
body.clean #bar,body.clean #sound,body.clean #veil,body.clean #grain{display:none!important}
@media (prefers-reduced-motion:reduce){#grain{display:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="frame" aria-label="Two Storms, 코드로 그린 애니메이션 단편">
    <canvas id="cv"></canvas>
    <canvas id="grain" width="256" height="139"></canvas>
    <div id="veil" hidden><h1 id="ttl">Two Storms</h1><button id="go">Watch with sound</button></div>
    <button id="sound">Turn sound on</button>
    <div id="bar" class="fade">
      <button class="ic" id="pp" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
      <div id="track" role="slider" aria-label="Seek" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="rail"><div id="fill"></div></div></div>
      <span id="time">0:00 / 1:20</span>
      <button class="ic" id="fs" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM6 15v3h3v2H4v-5zm12 3v-3h2v5h-5v-2z"/></svg></button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
/* =====================================================================
   Two Storms — everything below is drawn and synthesized at runtime.
   The film is a pure function of time: render(t) draws frame t, and the
   sound is a list of timed events scheduled on a WebAudio graph.
   ===================================================================== */
var W=1920,H=1040,DUR=80,D=Math.PI/180,TAU=Math.PI*2;
function clamp(x,a,b){return x<a?a:x>b?b:x}
function lerp(a,b,t){return a+(b-a)*t}
function sm(t){t=clamp(t,0,1);return t*t*(3-2*t)}
function eio(t){t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function eout(t){t=clamp(t,0,1);return 1-Math.pow(1-t,3)}
function ein(t){t=clamp(t,0,1);return t*t}
function lin(t){return clamp(t,0,1)}
function pr(t,a,b){return clamp((t-a)/(b-a),0,1)}
function hash(n){var s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function nz(x){var i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u)*2-1}
function RNG(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)|0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function mk(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,Math.max(0,r),0,TAU)}
function star(g,x,y,R,r,n,rot){g.beginPath();for(var i=0;i<n*2;i++){var a=rot+i*Math.PI/n,rr=i%2?r:R;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath()}
var INK='#1b1824';

/* ---------------------------------------------------------- characters */
var HERO={hair:'#f6c945',hairS:'#d99a26',skin:'#f6d2b2',skinS:'#dcab8a',jacket:'#2f88bd',jacketS:'#215f88',pants:'#2b3754',pantsS:'#1d263b',belt:'#e7e2d2',shoe:'#30323d',scarf:'#e2483b',band:'#2c3446',plate:'#cfd6df',eye:'#2f8fe0',type:0};
var RIVAL={hair:'#232638',hairS:'#14161f',skin:'#f1d6bf',skinS:'#cfa98e',jacket:'#35344c',jacketS:'#242336',pants:'#2a2939',pantsS:'#1b1a26',belt:'#7a58d0',shoe:'#26252f',coat:'#2b2a3f',band:'#2c3446',plate:'#cfd6df',eye:'#6a49c4',type:1};

var KEYS=['torso','head','aFu','aFl','aNu','aNl','lFu','lFl','lNu','lNl'];
var POSE={
 stand:{torso:0,head:0,aFu:-12,aFl:-6,aNu:14,aNl:20,lFu:-7,lFl:-4,lNu:8,lNl:3},
 ready:{torso:14,head:-10,aFu:45,aFl:125,aNu:70,aNl:150,lFu:-28,lFl:-8,lNu:32,lNl:-4},
 jump:{torso:22,head:-14,aFu:-70,aFl:-30,aNu:95,aNl:55,lFu:-25,lFl:-95,lNu:85,lNl:-5},
 punch:{torso:24,head:-16,aFu:-55,aFl:-125,aNu:92,aNl:90,lFu:-38,lFl:-18,lNu:38,lNl:8},
 kick:{torso:-28,head:20,aFu:70,aFl:110,aNu:-45,aNl:10,lFu:-4,lFl:2,lNu:100,lNl:96},
 guard:{torso:4,head:-6,aFu:35,aFl:165,aNu:48,aNl:170,lFu:-25,lFl:-10,lNu:28,lNl:-4},
 hit:{torso:-50,head:35,aFu:150,aFl:190,aNu:125,aNl:160,lFu:35,lFl:-5,lNu:65,lNl:25},
 crouch:{torso:38,head:-28,aFu:-30,aFl:-8,aNu:40,aNl:22,lFu:15,lFl:-75,lNu:78,lNl:-38},
 seal:{torso:4,head:0,aFu:35,aFl:170,aNu:42,aNl:175,lFu:-10,lFl:-4,lNu:10,lNl:2},
 throwF:{torso:18,head:-12,aFu:-70,aFl:-60,aNu:105,aNl:100,lFu:-30,lFl:-10,lNu:30,lNl:0},
 chargeW:{torso:16,head:-12,aFu:62,aFl:98,aNu:78,aNl:78,lFu:-38,lFl:-20,lNu:48,lNl:-12},
 chargeL:{torso:14,head:-14,aFu:38,aFl:85,aNu:22,aNl:62,lFu:-40,lFl:-22,lNu:50,lNl:-10},
 strike:{torso:30,head:-22,aFu:-80,aFl:-100,aNu:88,aNl:88,lFu:-45,lFl:-30,lNu:55,lNl:5},
 lie:{torso:0,head:0,aFu:-10,aFl:-8,aNu:8,aNl:12,lFu:-3,lFl:-2,lNu:4,lNl:2},
 fist:{torso:0,head:-8,aFu:-10,aFl:-8,aNu:145,aNl:168,lFu:-3,lFl:-2,lNu:14,lNl:-10}
};
function mix(a,b,t){var o={};for(var i=0;i<KEYS.length;i++){var k=KEYS[i];o[k]=lerp(a[k]||0,b[k]||0,t)}return o}
function over(a,b){var o={},k;for(k in a)o[k]=a[k];for(k in b)o[k]=b[k];return o}
function runP(ph,lean){lean=lean==null?36:lean;function leg(p){var s=Math.sin(p),c=Math.cos(p);var u=14+50*s;return[u,u-(52+44*c)]}
 var s=Math.sin(ph),n=leg(ph),f=leg(ph+Math.PI);
 return{torso:lean,head:-lean*.72,aFu:-112+7*s,aFl:-98+7*s,aNu:-118-7*s,aNl:-104-7*s,lNu:n[0],lNl:n[1],lFu:f[0],lFl:f[1]}}
function pz(p,t){return typeof p==='function'?p(t):typeof p==='string'?POSE[p]:p}

var SEG={tor:46,neck:56,au:26,al:25,lu:33,ll:34};
function rig(P){
 var L=P.torso*D,ux=Math.sin(L),uy=-Math.cos(L);
 var sh={x:ux*SEG.tor,y:uy*SEG.tor},nk={x:ux*SEG.neck,y:uy*SEG.neck};
 var ha=L+(P.head||0)*D,hd={x:nk.x+Math.sin(ha)*13,y:nk.y-Math.cos(ha)*13};
 function lim(b,a1,a2,l1,l2){var p1={x:b.x+Math.sin(a1*D)*l1,y:b.y+Math.cos(a1*D)*l1};return[b,p1,{x:p1.x+Math.sin(a2*D)*l2,y:p1.y+Math.cos(a2*D)*l2}]}
 return{L:L,ux:ux,uy:uy,sh:sh,nk:nk,hd:hd,ha:ha,
  aF:lim({x:sh.x-3,y:sh.y+1},P.aFu,P.aFl,SEG.au,SEG.al),aN:lim(sh,P.aNu,P.aNl,SEG.au,SEG.al),
  lF:lim({x:-2,y:0},P.lFu,P.lFl,SEG.lu,SEG.ll),lN:lim({x:2,y:0},P.lNu,P.lNl,SEG.lu,SEG.ll)}}
function legExt(R){return Math.max(R.lF[2].y,R.lN[2].y)+5}

// spiky hair silhouette, head radius r, facing +x
function hairPath(g,type,r){
 g.beginPath();var a0,a1,n,i;
 if(type===0){a0=-.3;a1=-3.35;n=7}else{a0=-.55;a1=-3.25;n=6}
 g.moveTo(Math.cos(a0)*.95*r,Math.sin(a0)*.95*r);
 for(i=0;i<n;i++){var u=(i+.5)/n,at,rt;
  if(type===0){at=lerp(a0,a1,u)-.12;rt=1.5+.12*Math.sin(i*2.3)}else{at=lerp(a0,a1,u)-.42*u-.1;rt=1.22+.62*u}
  g.lineTo(Math.cos(at)*rt*r,Math.sin(at)*rt*r);var av=lerp(a0,a1,(i+1)/n);g.lineTo(Math.cos(av)*.92*r,Math.sin(av)*.92*r)}
 g.lineTo(-.96*r,.3*r);g.lineTo(-.35*r,-.42*r);g.lineTo(.62*r,-.52*r);g.closePath()}
function bangsPath(g,type,r){g.beginPath();
 if(type===0){g.moveTo(.15*r,-.55*r);g.lineTo(.33*r,-.12*r);g.lineTo(.47*r,-.5*r);g.lineTo(.68*r,-.08*r);g.lineTo(.78*r,-.5*r);g.closePath()}
 else{g.moveTo(.5*r,-.62*r);g.lineTo(1.02*r,.42*r);g.lineTo(.72*r,-.05*r);g.lineTo(.62*r,.25*r);g.lineTo(.36*r,-.5*r);g.closePath()}}

function drawNinja(g,ch,P,o){
 var R=rig(P),s=o.s||1,f=o.face||1,rot=o.rot||0,t=o.t||0,w=o.wind==null?1:o.wind;
 var hipY=o.gnd===false?o.y:o.y-legExt(R)*s,cs=Math.cos(rot),sn=Math.sin(rot);
 function W2(p){var lx=p.x*s*f,ly=p.y*s;return[o.x+lx*cs-ly*sn,hipY+lx*sn+ly*cs]}
 var out={hand:W2(R.aN[2]),handF:W2(R.aF[2]),head:W2(R.hd),hip:[o.x,hipY],foot:W2(R.lN[2]),footF:W2(R.lF[2])};
 if(o.hide)return out;
 g.save();g.translate(o.x,hipY);g.rotate(rot);g.scale(s*f,s);
 if(o.alpha!=null)g.globalAlpha*=o.alpha;
 var S=o.sil,ink=S||INK,ow=S?0:4.5/Math.max(.6,Math.min(s,2.2))*1.3;
 function c(k){return S||ch[k]}
 g.lineCap='round';g.lineJoin='round';
 function line(pts,wd,col){g.beginPath();g.moveTo(pts[0].x,pts[0].y);for(var i=1;i<pts.length;i++)g.lineTo(pts[i].x,pts[i].y);if(ow){g.strokeStyle=ink;g.lineWidth=wd+ow;g.stroke()}g.strokeStyle=col;g.lineWidth=wd;g.stroke()}
 function dot(p,r,col){circ(g,p.x,p.y,r);g.fillStyle=col;g.fill();if(ow){g.strokeStyle=ink;g.lineWidth=ow*.55;g.stroke()}}
 function foot(leg,col){var p1=leg[1],p2=leg[2],dx=p2.x-p1.x,dy=p2.y-p1.y,l=Math.hypot(dx,dy)||1,fx=dy/l,fy=-dx/l;line([{x:p2.x-fx*3,y:p2.y-fy*3},{x:p2.x+fx*10,y:p2.y+fy*10}],8,col)}
 // far limbs
 line(R.lF,14,c('pantsS'));foot(R.lF,c('shoe'));
 line(R.aF,11.5,c('jacketS'));dot(R.aF[2],6,c('skinS'));
 // flowing cloth behind
 if(ch.scarf&&!o.calm){for(var k=0;k<2;k++){var bx=R.nk.x-3,by=R.nk.y+5,len=48+k*16,ph=t*13+k*1.7;
   g.beginPath();g.moveTo(bx,by);g.quadraticCurveTo(bx-len*.5,by+5+Math.sin(ph)*8*w,bx-len,by+12+k*7+Math.sin(ph+1.5)*13*w);
   if(ow){g.strokeStyle=ink;g.lineWidth=10+ow;g.stroke()}g.strokeStyle=c('scarf');g.lineWidth=10-k*2;g.stroke()}}
 var px=-R.uy,py=R.ux;
 if(ch.coat&&!o.calm){var fl=Math.sin(t*11)*w,fl2=Math.sin(t*11+1.3)*w;
  g.beginPath();g.moveTo(-px*11+R.ux*14,-py*11+R.uy*14);g.lineTo(-px*12,-py*12);
  g.quadraticCurveTo(-20-8*fl,26,-34-14*fl2-10*w,46+6*fl);g.lineTo(-6-6*fl,44);g.lineTo(px*9,py*9+8);g.closePath();
  g.fillStyle=c('coat');g.fill();if(ow){g.strokeStyle=ink;g.lineWidth=ow*.7;g.stroke()}}
 // torso
 function tq(a,b,col){g.beginPath();g.moveTo(-px*a,-py*a);g.lineTo(px*a,py*a);g.lineTo(R.sh.x+px*b,R.sh.y+py*b);g.lineTo(R.sh.x-px*b,R.sh.y-py*b);g.closePath();g.fillStyle=col;g.fill()}
 tq(12,14.5,c('jacket'));if(ow){g.strokeStyle=ink;g.lineWidth=ow*.7;g.stroke()}
 if(!S){g.beginPath();g.moveTo(-px*12,-py*12);g.lineTo(-px*4,-py*4);g.lineTo(R.sh.x-px*5,R.sh.y-py*5);g.lineTo(R.sh.x-px*14.5,R.sh.y-py*14.5);g.closePath();g.fillStyle=c('jacketS');g.fill();
  if(ch.type===0){g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1.6;g.beginPath();g.moveTo(px*3+R.ux*6,py*3+R.uy*6);g.lineTo(R.sh.x+px*4,R.sh.y+py*4);g.stroke()}
  else{g.strokeStyle='#d9d4ea';g.lineWidth=3;g.beginPath();g.moveTo(R.sh.x+px*13,R.sh.y+py*13);g.lineTo(px*5+R.ux*12,py*5+R.uy*12);g.stroke()}}
 line([{x:-px*12+R.ux*5,y:-py*12+R.uy*5},{x:px*12+R.ux*5,y:py*12+R.uy*5}],ch.type?6:5,c('belt'));
 line([R.nk,R.sh],8,c('skin'));
 // near leg
 line(R.lN,15,c('pants'));foot(R.lN,c('shoe'));
 // head
 g.save();g.translate(R.hd.x,R.hd.y);g.rotate(R.ha);
 var hr=15;
 // headband tails
 for(k=0;k<(o.calm?0:2);k++){var tp=t*12+k*1.1;g.beginPath();g.moveTo(-13,-5);g.quadraticCurveTo(-24,-3+Math.sin(tp)*4*w,-34-k*5,2+k*5+Math.sin(tp+1.2)*7*w);g.strokeStyle=c('band');g.lineWidth=3.2;g.stroke()}
 circ(g,0,0,hr);g.fillStyle=c('skin');g.fill();if(ow){g.strokeStyle=ink;g.lineWidth=ow*.55;g.stroke()}
 if(!S){g.save();circ(g,0,0,hr);g.clip();g.fillStyle=c('skinS');circ(g,-hr*1.25,0,hr);g.fill();g.restore()}
 hairPath(g,ch.type,hr);g.fillStyle=c('hair');g.fill();if(ow){g.strokeStyle=ink;g.lineWidth=ow*.55;g.stroke()}
 if(!S){g.save();hairPath(g,ch.type,hr);g.clip();g.fillStyle=c('hairS');circ(g,-hr*1.1,hr*.2,hr*.95);g.fill();g.restore()}
 // band and plate
 g.beginPath();g.moveTo(-14,-4);g.lineTo(14,-7.5);g.strokeStyle=c('band');g.lineWidth=6;g.stroke();
 g.fillStyle=c('plate');g.beginPath();g.rect(4,-11.5,10.5,8);g.fill();if(ow){g.strokeStyle=ink;g.lineWidth=1.3;g.stroke()}
 if(!S){g.strokeStyle='#59606e';g.lineWidth=1.2;g.beginPath();g.moveTo(6.5,-5.5);g.lineTo(9.2,-9.5);g.lineTo(12,-5.5);g.stroke()}
 bangsPath(g,ch.type,hr);g.fillStyle=c('hair');g.fill();if(ow){g.strokeStyle=ink;g.lineWidth=ow*.45;g.stroke()}
 if(!S){g.fillStyle=INK;if(ch.type===0){g.fillRect(8,-1.5,3.4,5)}else{g.save();g.translate(9.5,0);g.rotate(.25);g.fillRect(-2,-1,4.6,3.3);g.restore()}
  g.strokeStyle=INK;g.lineWidth=1.5;g.beginPath();g.moveTo(6.5,-3.5);g.lineTo(12,-2.2+(ch.type?0:-1));g.stroke();
  g.beginPath();g.moveTo(9,8.5);g.lineTo(12.5,8);g.stroke()}
 g.restore();
 // near arm
 line(R.aN,12.5,c('jacket'));dot(R.aN[2],7,c('skin'));
 g.restore();return out}

// hip position that puts the near hand on a target point
function placeHand(P,s,f,tx,ty){var R=rig(P);return{x:tx-R.aN[2].x*s*f,y:ty-R.aN[2].y*s}}

// big close-up face, unit head radius scaled by R
function faceClose(g,ch,cx,cy,R,f,t,narrow){
 g.save();g.translate(cx,cy);g.scale(R*f,R);var lw=1/R;
 hairPath(g,ch.type,1);g.fillStyle=ch.hair;g.fill();
 circ(g,0,0,1);g.fillStyle=ch.skin;g.fill();g.strokeStyle=INK;g.lineWidth=7*lw;g.stroke();
 g.save();circ(g,0,0,1);g.clip();g.fillStyle=ch.skinS;circ(g,-1.3,.1,1.05);g.fill();
 g.fillStyle='rgba(255,120,110,.18)';g.beginPath();g.ellipse(.62,.46,.22,.1,0,0,TAU);g.fill();g.restore();
 hairPath(g,ch.type,1);g.fillStyle=ch.hair;g.fill();g.strokeStyle=INK;g.lineWidth=7*lw;g.stroke();
 g.save();hairPath(g,ch.type,1);g.clip();g.fillStyle=ch.hairS;circ(g,-1.15,.35,1);g.fill();
 g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=10*lw;g.beginPath();g.arc(0,0,1.15,-2.2,-1.3);g.stroke();g.restore();
 // headband
