<body>

      <span class="brand-prompt" aria-hidden="true">&gt;&gt;&gt;</span>
      <span class="brand-name">파이썬 한 입</span>

<main id="app" class="wrap" tabindex="-1"></main>

<footer class="foot wrap">
  <p>코드는 브라우저 안에서 실행돼요(Brython). 학습 기록은 이 기기의 브라우저에만 저장돼요.</p>
</footer>

<script type="text/python" id="pyrunner">
from browser import window
import sys
import json
import traceback


class _Out:
    def __init__(self):
        self.display = []
        self.pure = []

    def write(self, s):
        s = str(s)
        self.display.append(s)
        self.pure.append(s)

    def flush(self):
        pass


def _run(src, stdin_text):
    out = _Out()
    lines = str(stdin_text).split("\n") if stdin_text else []
    pos = [0]

    def _input(prompt=""):
        out.display.append(str(prompt))
        if pos[0] < len(lines):
            value = lines[pos[0]]
            pos[0] += 1
            out.display.append(value + "\n")
            return value
        raise EOFError("입력값이 부족해요. '입력값' 칸에 줄을 추가하세요.")

    saved = (sys.stdout, sys.stderr)
    sys.stdout = out
    sys.stderr = out
    error = None
    kind = None
    try:
        exec(src, {"__name__": "__main__", "input": _input})
    except BaseException as e:
        kind = type(e).__name__
        tb = traceback.format_exc().rstrip("\n").split("\n")
        start = 1
        for i, line in enumerate(tb):
            if 'File "<string>"' in line:
                start = i
                break
        error = "\n".join([tb[0]] + tb[start:]) if start > 0 else "\n".join(tb)
    finally:
        sys.stdout, sys.stderr = saved
    return json.dumps({
        "display": "".join(out.display),
        "out": "".join(out.pure),
        "error": error,
        "kind": kind,
    })


window.pyRun = _run
</script>
<script src="lessons.js"></script>
<script src="app.js"></script>
</body>
</html>
