<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>月への路面電車</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif KR","Noto Serif JP",serif;color:#cfc6b0;}

  #gate .t{font-size:clamp(22px,4vw,38px);letter-spacing:.35em;color:#e8dcbc;}
  #gate .s{font-size:13px;letter-spacing:.2em;opacity:.65;}
  #gate .b{width:64px;height:64px;border:1px solid #8a8068;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  #gate .b:after{content:"";border-left:18px solid #e8dcbc;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px;}
  #gate.hide{opacity:0;pointer-events:none;}
  #hud{position:fixed;left:0;right:0;bottom:10px;text-align:center;font:12px/1 system-ui,sans-serif;color:#7c7464;opacity:0;transition:opacity .4s;pointer-events:none;}
  body:hover #hud.show{opacity:.7;}
</style>
</head>
<body>

  const prog = [['D2', 'A2', 'D3', 'F#3', 'A3'], ['C#2', 'A2', 'E3', 'A3', 'E4'], ['B1', 'F#2', 'D3', 'F#3', 'B3'], ['G1', 'D2', 'B2', 'D3', 'G3', 'B3'], ['F#2', 'A2', 'D3', 'A3', 'D4'], ['E2', 'B2', 'D3', 'G3', 'B3'], ['G2', 'B2', 'D3', 'G3', 'D4'], ['A2', 'E3', 'A3', 'D4', 'E4']];
  prog.forEach((ch, i) => mPad(55.7 + i * 1.18, 1.25, ch, 0.11, 0.6, 0.35));
  const mel = [['A4', 0, 0.6], ['D5', 0.6, 1.2], ['E5', 1.8, 0.3], ['F#5', 2.1, 0.9], ['E5', 3.0, 0.6], ['D5', 3.6, 0.6], ['B4', 4.2, 1.2], ['A4', 5.4, 0.6], ['B4', 6.0, 0.3], ['D5', 6.3, 0.3], ['E5', 6.6, 1.2], ['F#5', 7.8, 0.6], ['A5', 8.4, 1.6]];
  for (const [n, s, d] of mel) mLead(55.8 + s, d, n, 0.075);
  for (let k = 0; k < 16; k++) mPluck(55.8 + k * 0.59, ['D3', 'A3', 'F#3', 'A3'][k % 4], 0.035);
  for (const k of [56.4, 59.8, 63.0]) sTramBell(k, 0.26);
  sWhoosh(55.8, 4, 0.1, 200, 900); sWhoosh(60, 5, 0.12, 300, 1400);
  for (let k = 0; k < 18; k++) sCrackle(56 + k * 0.5 + Math.random() * 0.3, 0.08);
  // clouds: climax, rising arpeggio, swell into white
  mPad(65.0, 4.3, ['D2', 'A2', 'D3', 'F#3', 'A3', 'E4', 'F#4', 'A4', 'D5'], 0.14, 0.75, 1.2);
  mLead(65.1, 2.0, 'D6', 0.05); mLead(67.1, 2.2, 'E6', 0.05);
  { const arp = ['D5', 'F#5', 'A5', 'D6', 'E6', 'F#6', 'A6']; let tt = 65.2, k = 0; while (tt < 69.2) { sChime(tt, NOTE(arp[k % arp.length]) + (k >= arp.length ? 12 : 0) * 0, 0.05, 1.6); tt += Math.max(0.09, 0.32 - (tt - 65.2) * 0.06); k++; } }
  sWhoosh(65.2, 4.0, 0.16, 250, 2600); sCymbal(68.0, 1.5, 0.18);
  // the ending: rain thins, a music box remembers the theme, one bell from very far away
  const endP = [[69.6, ['G2', 'D3', 'B3', 'F#4']], [71.9, ['F#2', 'D3', 'A3', 'D4']], [74.2, ['E2', 'B2', 'G3', 'D4']], [76.4, ['A2', 'E3', 'A3', 'D4']], [78.0, ['D2', 'A2', 'F#3', 'A3', 'D4']]];
  endP.forEach(([tt, ch], i) => mPad(tt, i === 4 ? 1.5 : 2.2, ch, 0.07, 0.35, 1.0));
  for (const [n, s] of [['F#5', 0], ['E5', 0.55], ['D5', 1.1], ['A4', 1.65], ['B4', 2.75], ['D5', 3.3], ['E5', 3.85], ['D5', 5.0], ['A5', 6.4], ['F#5', 7.6]]) sChime(70.4 + s, NOTE(n), 0.07, 2.6);
  sTramBell(76.2, 0.22, 1);
}

// ── 90-main.js
// ───────────────────────── timeline & playback ─────────────────────────
const SHOTS = [];
function shot(t0, t1, fn) { SHOTS.push({ t0, t1, fn }); }
const S = mkCanvas(W, H), SX = S.getContext('2d');
const OUT = document.getElementById('out');
async function buildAll(progress) {
  const steps = [
    ['term', () => buildTerminus('rain')], ['fg1', () => buildFgWeeds(31)], ['under', () => buildUnder()],
    ['sil', () => buildSilhouette()], ['front', () => buildFrontStill()], ['roof', () => buildRoofSky()], ['wheels', () => buildWheelsBG()], ['bluff', () => buildBluff()], ['strip', () => buildTrackStrip()], ['far', () => buildFarTown()], ['lift', () => buildLiftStill()], ['tower', () => buildTower()], ['bankA', () => buildCloudBank(141, 720, 520)], ['bankB', () => buildCloudBank(142, 760, 520)], ['c13', () => buildClouds13()], ['termEnd', () => buildTerminus('end')], ['fg14', () => buildFgWeeds(77)],
  ];
  for (const fn of (window.EXTRA_BUILD || [])) steps.push(fn);
  for (let i = 0; i < steps.length; i++) { progress(i / steps.length); await new Promise(r => setTimeout(r, 0)); const t0 = performance.now(); SCN[steps[i][0]] = steps[i][1](); if (/log/.test(location.search)) console.log(steps[i][0], (performance.now() - t0) | 0, 'ms'); }
  progress(1);
}
function defineShots() {
  shot(0, 9, shotWide);
  shot(9, 13.5, shotCat1);
  shot(13.5, 13.5 + 4 / 24, shotBolt);
  shot(13.5 + 4 / 24, 15.6, shotStill(SCN.front));
  shot(15.6, 18, shotCat2);
  shot(18, 25, shotPanto);
  shot(25, 30.5, shotInterior);
  shot(30.5, 34, shotRoller);
  shot(34, 40.5, shotWheels);
  shot(40.5, 49, shotStitch);
  shot(49, 54, shotTrack);
  shot(54, 55.6, shotStill(SCN.lift));
  shot(55.6, 65, shotTower);
  shot(65, 69.5, shotClouds);
  shot(69.5, 80.01, shotEnd);
  for (const s of (window.EXTRA_SHOTS || [])) shot(...s);
}
function renderFrame(t) {
  const frame = Math.floor(t * FPS + 1e-6); t = frame / FPS;
  const sh = SHOTS.find(s => t >= s.t0 - 1e-6 && t < s.t1 - 1e-6) || SHOTS[SHOTS.length - 1];
  SX.setTransform(1, 0, 0, 1, 0, 0); SX.globalAlpha = 1; SX.globalCompositeOperation = 'source-over'; LW = 1;
  SX.fillStyle = '#000'; SX.fillRect(0, 0, W, H);
  const po = sh.fn(SX, t - sh.t0, t) || {};
  POST.apply(S, OUT, frame, po);
}

// ── 95-player.js
// ───────────────────────── player ─────────────────────────
(() => {
  const qs = new URLSearchParams(location.search), still = qs.has('still'), startAt = clamp(+(qs.get('t') || 0), 0, DUR - 0.5);
  const gate = document.getElementById('gate'), gs = document.getElementById('gs'), hud = document.getElementById('hud');
  let playing = false, lastFrame = -1, clock0 = 0, offset = startAt, ended = false;
  const now = () => AU.ctx ? AU.ctx.currentTime - AU.T0 : (performance.now() / 1000 - clock0);
  function loop() {
    if (!playing) return;
    const t = now();
    if (t >= DUR) { playing = false; ended = true; renderFrame(DUR - 0.001); gate.classList.remove('hide'); gs.textContent = '다시 보기'; if (AU.ctx) AU.ctx.close(); AU.ctx = null; return; }
    const f = Math.floor(Math.max(0, t) * FPS);
    if (f !== lastFrame) { lastFrame = f; renderFrame(Math.max(0, t)); }
    requestAnimationFrame(loop);
  }
  function start(from) {
    if (AU.ctx) { try { AU.ctx.close(); } catch (e) { } AU.ctx = null; }
    try { const ctx = audioStart(from); if (ctx.state === 'suspended') ctx.resume(); } catch (e) { clock0 = performance.now() / 1000 - from; }
    ended = false; playing = true; lastFrame = -1; gate.classList.add('hide');
    setTimeout(() => hud.classList.remove('show'), 4000);
    requestAnimationFrame(loop);
  }
  (async () => {
    await buildAll((p) => { gs.textContent = `그림을 그리는 중… ${Math.round(p * 100)}%`; });
    defineShots();
    renderFrame(startAt);
    window.__ready = true;
    window.__renderAt = (t) => { renderFrame(t); return OUT.toDataURL('image/png'); };
    if (still) { gate.style.display = 'none'; hud.style.display = 'none'; return; }
    gs.textContent = '클릭하면 재생됩니다 · 소리를 켜 주세요 (80초)';
    gate.addEventListener('click', () => start(ended ? 0 : offset));
  })();
  addEventListener('keydown', (e) => {
    if (!window.__ready || still) return;
    if (e.code === 'Space') { e.preventDefault(); if (!AU.ctx || ended) return; if (AU.ctx.state === 'running') { AU.ctx.suspend(); playing = false; } else { AU.ctx.resume(); playing = true; requestAnimationFrame(loop); } }
    else if (e.key === 'r' || e.key === 'R') start(0);
    else if (e.key === 'f' || e.key === 'F') { const el = document.documentElement; document.fullscreenElement ? document.exitFullscreen() : (el.requestFullscreen && el.requestFullscreen()); }
  });
})();
