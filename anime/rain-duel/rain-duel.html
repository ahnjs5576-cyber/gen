<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

</style></head><body>
<div id="wrap"><canvas id="scr" width="1280" height="720"></canvas></div>
<div id="ui"><b>雨 中 の 決 闘</b><span id="msg">현상 중…</span><small>클릭하면 재생 · Space 일시정지 · R 처음부터</small></div>
<script>
// ---- 01_core.js ----
'use strict';
// ===================================================================
//  CORE — rng, noise, colour, splines, hand-inked lines, cel paint
// ===================================================================
const W = 1280, H = 720, FPS = 24, DUR = 80;
const TAU = Math.PI * 2, D2R = Math.PI / 180;

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
let R = mulberry(1);
function seed(...a) { R = mulberry(hashStr(a.join('|'))); }
const rnd = (a = 0, b = 1) => a + (b - a) * R();
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const rsgn = () => (R() < .5 ? -1 : 1);
const pick = arr => arr[Math.floor(R() * arr.length)];
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lin = (a, b, x) => clamp((x - a) / (b - a), 0, 1);
const easeIn = t => t * t, easeOut = t => 1 - (1 - t) * (1 - t);
const easeIO = t => (t < .5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t));
function hn(i, s) { let h = Math.imul(i | 0, 374761393) + Math.imul(s | 0, 668265263); h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
function vnoise(x, s = 0) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hn(i, s), hn(i + 1, s), u) * 2 - 1; }
function fbm(x, s = 0) { return vnoise(x, s) * .6 + vnoise(x * 2.1, s + 7) * .3 + vnoise(x * 4.3, s + 13) * .1; }
function hn2(x, y, s) { return hn(Math.imul(x | 0, 73856093) ^ Math.imul(y | 0, 19349663), s); }
function vn2(x, y, s = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hn2(ix, iy, s), b = hn2(ix + 1, iy, s), c = hn2(ix, iy + 1, s), d = hn2(ix + 1, iy + 1, s);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uy) * 2 - 1;
}
function fbm2(x, y, s = 0) { return vn2(x, y, s) * .55 + vn2(x * 2.03, y * 2.03, s + 5) * .28 + vn2(x * 4.1, y * 4.1, s + 9) * .17; }

// ---------- colour ----------
const _hx = {};
function hx(h) { if (Array.isArray(h)) return h; if (_hx[h]) return _hx[h]; const v = parseInt(h.slice(1), 16); return (_hx[h] = [v >> 16 & 255, v >> 8 & 255, v & 255]); }
function mixc(a, b, t) { const A = hx(a), B = hx(b); return [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t]; }
function mulc(a, m) { const A = hx(a); const M = typeof m === 'number' ? [m, m, m] : hx(m).map(v => v / 255); return [A[0] * M[0], A[1] * M[1], A[2] * M[2]]; }
function addc(a, b, t = 1) { const A = hx(a), B = hx(b); return [Math.min(255, A[0] + B[0] * t), Math.min(255, A[1] + B[1] * t), Math.min(255, A[2] + B[2] * t)]; }
function css(c, al) { const C = hx(c); return al == null ? `rgb(${C[0] | 0},${C[1] | 0},${C[2] | 0})` : `rgba(${C[0] | 0},${C[1] | 0},${C[2] | 0},${al})`; }
function mixs(a, b, t, al) { return css(mixc(a, b, t), al); }
function jitc(c, a) { const C = hx(c); const d = rnd(-a, a); return [C[0] + d + rnd(-a, a) * .4, C[1] + d + rnd(-a, a) * .4, C[2] + d + rnd(-a, a) * .4]; }

// ---------- geometry ----------
const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
const add2 = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k];
const lerp2 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const dirv = a => [Math.sin(a), Math.cos(a)];           // angle from "down", +x forward
function norm2(v) { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; }
function rot2(p, a, c = [0, 0]) { const s = Math.sin(a), co = Math.cos(a), x = p[0] - c[0], y = p[1] - c[1]; return [c[0] + x * co - y * s, c[1] + x * s + y * co]; }
function tr(pts, ox, oy, sx = 1, sy = sx, rot = 0) {
  const s = Math.sin(rot), c = Math.cos(rot);
  return pts.map(p => { const x = p[0] * sx, y = p[1] * sy; const q = [ox + x * c - y * s, oy + x * s + y * c]; if (p[2]) q[2] = p[2]; return q; });
}
function jit(pts, a) { return pts.map(p => { const q = [p[0] + rnd(-a, a), p[1] + rnd(-a, a)]; if (p[2]) q[2] = p[2]; return q; }); }

// Catmull-Rom through control points; a point with p[2] truthy is a hard corner
function spline(pts, closed, step = 3) {
  const n = pts.length; if (n < 3 && closed) return pts.map(p => [p[0], p[1]]);
  if (n < 2) return pts.map(p => [p[0], p[1]]);
  const out = [];
  const g = i => (closed ? pts[((i % n) + n) % n] : pts[i < 0 ? 0 : i > n - 1 ? n - 1 : i]);
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p1 = g(i), p2 = g(i + 1);
    let p0 = g(i - 1), p3 = g(i + 2);
    if (p1[2]) p0 = p1;
    if (p2[2]) p3 = p2;
    const len = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
    const m = Math.max(1, Math.ceil(len / step));
    for (let j = 0; j < m; j++) {
      const t = j / m, t2 = t * t, t3 = t2 * t;
      out.push([
        .5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        .5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]);
    }
  }
  if (!closed) out.push([pts[n - 1][0], pts[n - 1][1]]);
  return out;
}
function poly(ctx, d, closed = true, off) {
  ctx.beginPath(); addPoly(ctx, d, closed, off);
}
function addPoly(ctx, d, closed = true, off) {
  const ox = off ? off[0] : 0, oy = off ? off[1] : 0;
  ctx.moveTo(d[0][0] + ox, d[0][1] + oy);
  for (let i = 1; i < d.length; i++) ctx.lineTo(d[i][0] + ox, d[i][1] + oy);
  if (closed) ctx.closePath();
}
function fillD(ctx, d, col, al) { ctx.fillStyle = css(col, al); poly(ctx, d); ctx.fill(); }
function shape(pts, j = 0, step = 3) { return spline(j ? jit(pts, j) : pts, true, step); }

// ---------- hand-inked line: variable width ribbon with swells & tapers ----------
const INK = '#21161a';
function ink(ctx, pts, o = {}) {
  const w = o.w ?? 2, closed = !!o.closed;
  const d = o.dense ? pts : spline(pts, closed, o.step || 2.5);
  const n = d.length; if (n < 2) return;
  const L = new Float32Array(n);
  for (let i = 1; i < n; i++) L[i] = L[i - 1] + Math.hypot(d[i][0] - d[i - 1][0], d[i][1] - d[i - 1][1]);
  const tot = L[n - 1] || 1;
  const tp = o.tp ?? 40;
  const ta = closed ? 0 : Math.min(tot * (o.t0 ?? .3), tp), tb = closed ? 0 : Math.min(tot * (o.t1 ?? .3), tp);
  const sv = o.sv ?? .3, ns = R() * 100, sc = o.sc ?? 45;
  const lf = [], rt = [];
  for (let i = 0; i < n; i++) {
    const s = L[i]; let p = 1;
    if (ta > 0) p *= Math.pow(clamp(s / ta, 0, 1), .55);
    if (tb > 0) p *= Math.pow(clamp((tot - s) / tb, 0, 1), .55);
    p *= 1 + sv * vnoise(s / sc + ns, 3);
    if (o.prof) p *= o.prof(s / tot);
    const hw = Math.max(.12, w * p * .5);
    const a = closed ? d[(i - 1 + n) % n] : d[Math.max(0, i - 1)], b = closed ? d[(i + 1) % n] : d[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    lf.push([d[i][0] - ty * hw, d[i][1] + tx * hw]); rt.push([d[i][0] + ty * hw, d[i][1] - tx * hw]);
  }
  ctx.fillStyle = css(o.c ?? INK, o.a);
  ctx.beginPath();
  if (closed) { addPoly(ctx, lf); addPoly(ctx, rt); ctx.fill('evenodd'); }
  else { ctx.moveTo(lf[0][0], lf[0][1]); for (let i = 1; i < n; i++) ctx.lineTo(lf[i][0], lf[i][1]); for (let i = n - 1; i >= 0; i--) ctx.lineTo(rt[i][0], rt[i][1]); ctx.closePath(); ctx.fill(); }
}
// short tapered pencil-ink stroke from a to b with optional bend
function stk(ctx, a, b, w, c, bend = 0, o = {}) {
  const m = [(a[0] + b[0]) / 2 + (a[1] - b[1]) * bend, (a[1] + b[1]) / 2 + (b[0] - a[0]) * bend];
  ink(ctx, [a, m, b], Object.assign({ w, c, t0: .45, t1: .45 }, o));
}

// ---------- cel paint ----------
// band: hard-edged second tone = part minus (part shifted by off). colour line on the edge.
function cel(ctx, d, o) {
  ctx.fillStyle = css(o.f); poly(ctx, d); ctx.fill();
  if (o.bands && o.bands.length) {
    ctx.save(); poly(ctx, d); ctx.clip();
    for (const b of o.bands) {
      if (!b) continue;
      const sd = b.shape || d;
      ctx.beginPath();
      if (b.inside) addPoly(ctx, sd, true, b.off);
      else { ctx.rect(-4000, -4000, 9000, 9000); addPoly(ctx, sd, true, b.off); }
      ctx.fillStyle = css(b.c); ctx.fill(b.inside ? 'nonzero' : 'evenodd');
      if (b.lc) { const td = b.off ? sd.map(p => [p[0] + b.off[0], p[1] + b.off[1]]) : sd; ink(ctx, td, { dense: true, closed: true, w: b.lw || 1.1, c: b.lc, sv: .5 }); }
    }
    if (o.paint) paintInside(ctx, d, o.f, o.paint);
    ctx.restore();
  } else if (o.paint) { ctx.save(); poly(ctx, d); ctx.clip(); paintInside(ctx, d, o.f, o.paint); ctx.restore(); }
  if (o.lw !== 0) ink(ctx, d, { dense: true, closed: true, w: o.lw ?? 2, c: o.lc ?? INK, sv: o.sv ?? .4 });
}
function bbox(d) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const p of d) { if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0]; if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; } return [x0, y0, x1, y1]; }
// harmony-frame treatment: brush texture inside an already clipped cel area
function paintInside(ctx, d, base, amt) {
  const [x0, y0, x1, y1] = bbox(d); const area = (x1 - x0) * (y1 - y0);
  const n = Math.min(260, 10 + area / 260 * amt);
  for (let i = 0; i < n; i++) {
    const x = rnd(x0, x1), y = rnd(y0, y1);
    ctx.globalAlpha = rnd(.05, .16) * Math.min(1, amt);
    brush(ctx, x, y, rnd(8, 30), rnd(-.6, .6) + 1.2, rnd(2, 6), R() < .5 ? addc(base, [30, 30, 40], 1) : mulc(base, .7));
  }
  ctx.globalAlpha = 1;
}

// ribbon: chain of points with half-widths → closed outline (left side, end cap, right side back)
function ribbon(chain, widths, o = {}) {
  const d = spline(chain, false, o.step || 2.5);
  const n = d.length; const L = [0];
  for (let i = 1; i < n; i++) L[i] = L[i - 1] + dist(d[i - 1], d[i]);
  const tot = L[n - 1] || 1;
  const wAt = t => { const k = t * (widths.length - 1); const i = Math.min(widths.length - 2, Math.floor(k)); const f = k - i; const a = widths[i], b = widths[i + 1]; return [lerp(a[0] ?? a, b[0] ?? b, f), lerp(a[1] ?? a, b[1] ?? b, f)]; };
  const lf = [], rt = [];
  for (let i = 0; i < n; i++) {
    const a = d[Math.max(0, i - 1)], b = d[Math.min(n - 1, i + 1)];
    const t = norm2([b[0] - a[0], b[1] - a[1]]); const w = wAt(L[i] / tot);
    lf.push([d[i][0] - t[1] * w[0], d[i][1] + t[0] * w[0]]);
    rt.push([d[i][0] + t[1] * w[1], d[i][1] - t[0] * w[1]]);
  }
  const out = lf.slice();
  // round end cap
  const e = d[n - 1], ta = norm2([d[n - 1][0] - d[n - 2][0], d[n - 1][1] - d[n - 2][1]]);
  const capE = o.capE ?? 1, capS = o.capS ?? 1;
  const we = wAt(1); const re = (we[0] + we[1]) / 2;
  for (let k = 1; k < 6; k++) { const a = Math.PI * k / 6; const nx = -ta[1], ny = ta[0]; out.push([e[0] + (nx * Math.cos(a) + ta[0] * Math.sin(a) * capE) * re, e[1] + (ny * Math.cos(a) + ta[1] * Math.sin(a) * capE) * re]); }
  for (let i = n - 1; i >= 0; i--) out.push(rt[i]);
  const s = d[0], ts = norm2([d[1][0] - d[0][0], d[1][1] - d[0][1]]); const ws = wAt(0); const rs = (ws[0] + ws[1]) / 2;
  for (let k = 1; k < 6; k++) { const a = Math.PI * k / 6; const nx = ts[1], ny = -ts[0]; out.push([s[0] + (nx * Math.cos(a) - ts[0] * Math.sin(a) * capS) * rs, s[1] + (ny * Math.cos(a) - ts[1] * Math.sin(a) * capS) * rs]); }
  return out;
}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ---- 02_paint.js ----
// ===================================================================
//  PAINT — poster-colour background painting on paper
// ===================================================================
function brush(ctx, x, y, len, ang, w, col, o) {
  const c = Math.cos(ang), s = Math.sin(ang), nx = -s, ny = c;
  const bend = o && o.bend != null ? o.bend : rnd(-.12, .12);
  const N = 6, Lp = [], Rp = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, b = bend * len * 2 * t * (1 - t);
    const px = x + c * len * t + nx * b, py = y + s * len * t + ny * b;
    const prof = t < .15 ? .8 + t : t > .7 ? 1 - (t - .7) * 1.9 : 1;
    const hw = w * .5 * prof * (1 + rnd(-.14, .14));
    Lp.push([px + nx * hw, py + ny * hw]); Rp.push([px - nx * hw, py - ny * hw]);
  }
  ctx.fillStyle = css(col);
  ctx.beginPath(); ctx.moveTo(Lp[0][0], Lp[0][1]);
  for (let i = 1; i <= N; i++) ctx.lineTo(Lp[i][0], Lp[i][1]);
  for (let i = N; i >= 0; i--) ctx.lineTo(Rp[i][0], Rp[i][1]);
  ctx.closePath(); ctx.fill();
  if (w > 3.5 && !(o && o.nob)) {
    const ga = ctx.globalAlpha; const nb = Math.min(4, 1 + (w / 5 | 0));
    for (let k = 0; k < nb; k++) {
      const off = rnd(-.4, .4) * w, t0 = rnd(0, .4), t1 = rnd(.6, 1);
      ctx.globalAlpha = ga * rnd(.25, .55);
      ctx.strokeStyle = css(R() < .5 ? addc(col, [16, 16, 20]) : mulc(col, .78));
      ctx.lineWidth = rnd(.5, 1.3);
      ctx.beginPath();
      ctx.moveTo(x + c * len * t0 + nx * off, y + s * len * t0 + ny * off);
      ctx.quadraticCurveTo(x + c * len * .5 + nx * (off + bend * len * .5), y + s * len * .5 + ny * (off + bend * len * .5), x + c * len * t1 + nx * off, y + s * len * t1 + ny * off);
      ctx.stroke();
    }
    ctx.globalAlpha = ga;
  }
}
// dry-brush scumble: broken streaks of thin bristle lines
function dryBrush(ctx, x, y, len, ang, w, col, al = .5) {
  const c = Math.cos(ang), s = Math.sin(ang), nx = -s, ny = c;
  const n = 4 + (w / 1.5 | 0);
  ctx.strokeStyle = css(col);
  for (let k = 0; k < n; k++) {
    const off = rnd(-.5, .5) * w; const t0 = rnd(0, .3), t1 = rnd(.5, 1);
    ctx.globalAlpha = al * rnd(.3, 1); ctx.lineWidth = rnd(.4, 1.4);
    ctx.beginPath(); ctx.moveTo(x + c * len * t0 + nx * off, y + s * len * t0 + ny * off); ctx.lineTo(x + c * len * t1 + nx * off, y + s * len * t1 + ny * off); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ---------- paper ----------
let PAPER = null;
function makePaper() {
  const c = mkCanvas(W, H), g = c.getContext('2d');
  const id = g.createImageData(W, H), a = id.data;
  seed('paper');
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4;
    const n = fbm2(x / 3.2, y / 3.2, 4) * 16 + fbm2(x / 40, y / 40, 9) * 10 + (hn2(x, y, 7) - .5) * 18;
    const v = 128 + n; a[i] = v; a[i + 1] = v; a[i + 2] = v; a[i + 3] = 255;
  }
  g.putImageData(id, 0, 0);
  // fibres
  for (let i = 0; i < 1400; i++) {
    const x = rnd(0, W), y = rnd(0, H), l = rnd(4, 18), an = rnd(0, TAU);
    g.strokeStyle = R() < .5 ? 'rgba(255,255,255,.18)' : 'rgba(0,0,0,.14)'; g.lineWidth = rnd(.4, .9);
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(an) * l * .5 + rnd(-3, 3), y + Math.sin(an) * l * .5 + rnd(-3, 3), x + Math.cos(an) * l, y + Math.sin(an) * l); g.stroke();
  }
  PAPER = c;
}
function applyPaper(ctx, w, h, al = .22) {
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = al;
  for (let y = 0; y < h; y += H) for (let x = 0; x < w; x += W) ctx.drawImage(PAPER, x, y);
  ctx.restore();
}

// ---------- palettes ----------
const PAL = {
  night: {
    sky: ['#070b17', '#111a31', '#1c2644', '#2a3456'], cloudD: '#0d1325', cloudM: '#18213a', cloudL: '#2c3758', cloudRim: '#46527a',
    mtn: ['#2a3352', '#202943', '#171e34'], mist: '#3a4466', stone: '#2c3247', stoneL: '#3b425a', stoneD: '#1b1f2e', joint: '#0e1019',
    sheen: '#4d5878', torii: '#4b2826', toriiD: '#2b1617', toriiL: '#6a3a33', cedar: '#0b1418', cedarL: '#1b2a2f', moss: '#1f2b28',
    lamp: '#f2b25c', water: '#232a40', rubble: '#30364b'
  },
  moon: {
    sky: ['#0d1428', '#1f2c4e', '#3b4a72', '#5d6a91'], cloudD: '#1a2340', cloudM: '#2d3a60', cloudL: '#5b6893', cloudRim: '#aeb8d8',
    mtn: ['#4a5579', '#353f60', '#252d48'], mist: '#66709a', stone: '#3a4260', stoneL: '#56608a', stoneD: '#232940', joint: '#121524',

function skyCol(P, t) { const s = P.sky; const k = clamp(t, 0, .999) * (s.length - 1); const i = Math.floor(k); return mixc(s[i], s[i + 1], k - i); }

// ---------- sky ----------
function paintSky(g, w, h, P, o = {}) {

function cloudShape(cx, cy, wd, ht, sd) {

function paintStorm(g, w, h, P, o = {}) {

// ---------- mountains ----------
function ridge(w, base, amp, sd, rough = 1) {

    g.globalAlpha = 1; g.restore();
  });
}

// ---------- cedar (sugi) ----------

// ---------- torii ----------

// ---------- stone lantern (toro) ----------

// ---------- ground: flooded stone pavement in perspective ----------
function paintPavement(g, w, h, P, o) {
  const hz = o.hz, vx = o.vx;
  seed('pave', o.sd || 0);
  g.fillStyle = css(P.joint); g.fillRect(0, hz, w, h - hz);
  // rows
  let z = 1; const rows = [];
  let y = hz + 2;
  while (y < h + 40) { const ny = y + Math.max(3, (y - hz) * (o.rowK || .22) * rnd(.85, 1.15)); rows.push([y, ny]); y = ny; }
  for (const [y0, y1] of rows) {
    const k = (y0 - hz) / (h - hz);
    const sw = (40 + 380 * k) * (o.slab || 1);
    let x = -rnd(0, sw);
    while (x < w + sw) {
      const ww = sw * rnd(.6, 1.4);
      // converge sides to the vanishing point
      const f0 = (y0 - hz), f1 = (y1 - hz);
      const xa = vx + (x - vx) * (f0 / Math.max(1, f1)), xb = vx + (x + ww - vx) * (f0 / Math.max(1, f1));
      const gap = .8 + k * 2.6;
      const quad = [[xa + gap, y0 + gap * .5], [xb - gap, y0 + gap * .5], [x + ww - gap, y1 - gap * .5], [x + gap, y1 - gap * .5]];
      const base = jitc(mixc(mixc(P.stone, P.stoneD, rnd(0, .7)), skyCol(P, .9), rnd(0, .25)), 6);
      fillD(g, jit(quad, gap * .4), base);
      // wet surface strokes
      const nstk = 2 + (ww * (y1 - y0) / 900 | 0);
      g.save(); poly(g, quad); g.clip();
      for (let i = 0; i < Math.min(nstk, 30); i++) brush(g, rnd(x, x + ww), rnd(y0, y1), rnd(10, 40) * (.3 + k), rnd(-.05, .05), rnd(1.5, 4) * (.4 + k), jitc(R() < .5 ? P.stoneL : P.stoneD, 5));
      g.restore();
      x += ww;
    }
    g.globalAlpha = .9; g.fillStyle = css(P.joint); g.fillRect(0, y1 - 1 - k * 1.5, w, 1 + k * 2); g.globalAlpha = 1;
  }
  // puddles
  for (let i = 0; i < (o.puddles || 14); i++) {
    const py = hz + Math.pow(rnd(.05, 1), 1.3) * (h - hz);
    const k = (py - hz) / (h - hz);
    const pw = rnd(60, 260) * (.2 + k * 1.2), ph = pw * (.05 + k * .14);
    const px = rnd(0, w);
    const pts = []; for (let a = 0; a < 12; a++) { const an = a / 12 * TAU; pts.push([px + Math.cos(an) * pw * rnd(.7, 1.1), py + Math.sin(an) * ph * rnd(.7, 1.1)]); }
    const d = spline(pts, true, 4);
    fillD(g, d, mixc(P.water, skyCol(P, .8), .5));
    g.save(); poly(g, d); g.clip();
    for (let j = 0; j < 8 + pw / 8; j++) brush(g, rnd(px - pw, px + pw), rnd(py - ph, py + ph), rnd(10, 50) * (.3 + k), rnd(-.03, .03), rnd(1, 3) * (.3 + k), jitc(R() < .6 ? P.sheen : skyCol(P, .6), 6), { nob: 1 });
    g.restore();
    ink(g, d.slice(d.length / 2 | 0), { dense: true, w: 1 + k * 1.5, c: P.joint, a: .7 });
  }
}
// reflect everything above hz into the flooded ground, broken into ripples
function reflect(g, w, h, hz, al = .32, P) {
  const tmp = mkCanvas(w, h), t = tmp.getContext('2d');
  t.save(); t.translate(0, hz * 2); t.scale(1, -1); t.drawImage(g.canvas, 0, 0); t.restore();
  const mk = mkCanvas(w, h), m = mk.getContext('2d');
  seed('refl', hz);
  for (let y = hz; y < h; y += rnd(2, 6)) {
    const k = (y - hz) / (h - hz);
    m.fillStyle = `rgba(0,0,0,${(1 - k) * .9 + .1})`;
    for (let x = -50; x < w; x += rnd(30, 120)) m.fillRect(x + rnd(-10, 10), y, rnd(25, 100), rnd(1, 4) * (1 + k * 2));
  }
  t.globalCompositeOperation = 'destination-in'; t.drawImage(mk, 0, 0);
  t.globalCompositeOperation = 'source-over';
  g.save(); g.beginPath(); g.rect(0, hz, w, h - hz); g.clip(); g.globalAlpha = al; g.drawImage(tmp, 0, 0); g.restore();
}
function paintLampSheen(g, x, hz, y1, w0, col, al = .35) {

  g.globalAlpha = 1;
}

    const pts = []; const m = rndi(5, 7); for (let a = 0; a < m; a++) { const an = a / m * TAU + rnd(-.3, .3); pts.push([x + Math.cos(an) * r * rnd(.7, 1.2), y + Math.sin(an) * r * .6 * rnd(.7, 1.2), 1]); }
    const d = spline(pts, true, 3);
    cel(g, d, { f: jitc(P.rubble, 6), bands: [{ c: P.stoneD, off: [-r * .25, -r * .3] }, { c: P.stoneL, off: [r * .2, r * .25] }], lw: 1.2, lc: P.joint });
  }
}

const BG = {};
function board(w, h) { const c = mkCanvas(w, h); return [c, c.getContext('2d')]; }

// shared: the mountain shrine courtyard on the cliff
function paintCourtyard(g, w, h, P, o) {
  const hz = o.hz;
  paintSky(g, w, hz + 40, P);
  paintStorm(g, w, hz + 20, P, { sd: o.sd || 0, rows: o.cloudRows, scale: o.cloudScale || 1 });
  if (o.moon) paintMoon(g, o.moon[0], o.moon[1], o.moon[2], P);
  paintMountains(g, w, P, [
    { y: hz - 70 * o.ms, amp: 70 * o.ms, depth: 120, c: P.mtn[0], sd: 3.1 },
    { y: hz - 35 * o.ms, amp: 55 * o.ms, depth: 80, c: P.mtn[1], sd: 7.7 },
    { y: hz - 5 * o.ms, amp: 30 * o.ms, depth: 60, c: P.mtn[2], sd: 12.3, rough: 1.4 }]);
  // mist band at the cliff edge
  seed('edge', o.sd || 0);
  for (let i = 0; i < w / 6; i++) { g.globalAlpha = rnd(.08, .22); brush(g, rnd(-60, w), hz - rnd(-6, 30), rnd(60, 180), rnd(-.02, .02), rnd(6, 18), P.mist, { nob: 1 }); }
  g.globalAlpha = 1;
  // cliff lip / low stone edge
  const lip = []; for (let x = -10; x <= w + 10; x += 20) lip.push([x, hz + rnd(-2, 2)]);
  for (const t of (o.torii || [])) paintTorii(g, t.x, t.y, t.h, P, t);
  for (const c of (o.cedarsBack || [])) paintCedar(g, c.x, c.y, c.h, P, c.sd, c);
  g.fillStyle = css(P.stoneD); g.fillRect(0, hz - 2, w, 5);
  paintPavement(g, w, h, P, { hz: hz + 2, vx: o.vx, sd: o.sd || 0, puddles: o.puddles || 16, rowK: o.rowK, slab: o.slab });
  const lamps = [];
  for (const L of (o.lanterns || [])) lamps.push(Object.assign(paintLantern(g, L.x, L.y, L.h, P, L), { lit: L.lit }));
  for (const c of (o.cedars || [])) paintCedar(g, c.x, c.y, c.h, P, c.sd, c);
  reflect(g, w, h, hz + 2, o.reflA ?? .3, P);
  for (const L of lamps) if (L.lit) {
    paintLampSheen(g, L.win[0], hz + 4, h, 8 * L.s, P.lamp, .25);
    const gr = g.createRadialGradient(L.win[0], L.win[1], 2, L.win[0], L.win[1], 60 * L.s);
    gr.addColorStop(0, 'rgba(255,190,110,.35)'); gr.addColorStop(1, 'rgba(255,170,90,0)');
    g.fillStyle = gr; g.fillRect(L.win[0] - 80 * L.s, L.win[1] - 80 * L.s, 160 * L.s, 160 * L.s);
  }
  for (const r of (o.rubble || [])) paintRubble(g, r[0], r[1], r[2], P, r[3], r[4]);
  if (o.post) o.post(g);
  applyPaper(g, w, h, .26);
  return lamps;
}
function paintMoon(g, x, y, r, P) {
  seed('moon');
  // parted clouds: clear sky window with moonlit cloud edges
  for (let i = 0; i < 260; i++) { const a = rnd(0, TAU), rr = Math.sqrt(R()) * r * 4.2; g.globalAlpha = .9; brush(g, x + Math.cos(a) * rr * 1.5 - 30, y + Math.sin(a) * rr * .7, rnd(30, 80), rnd(-.1, .1), rnd(8, 18), jitc(mixc('#3a4a78', '#1d2950', rr / (r * 4.2)), 4)); }
  for (let i = 0; i < 70; i++) { const a = rnd(0, TAU), rr = r * rnd(3.6, 5); g.globalAlpha = rnd(.15, .4); brush(g, x + Math.cos(a) * rr * 1.5 - 20, y + Math.sin(a) * rr * .7, rnd(20, 60), rnd(-.3, .3), rnd(3, 8), jitc(P.cloudRim, 6)); }
  g.globalAlpha = .18; for (let i = 0; i < 20; i++) brush(g, x - r * 3 + rnd(0, r * 6), y + rnd(-r * 1.4, r * 1.4), rnd(r, r * 3), rnd(-.1, .1), rnd(r * .3, r * .8), '#c8d0ee', { nob: 1 });
  g.globalAlpha = 1;
  const d = shape(Array.from({ length: 16 }, (_, i) => [x + Math.cos(i / 16 * TAU) * r, y + Math.sin(i / 16 * TAU) * r]), .6, 3);
  cel(g, d, { f: '#e8e6dc', bands: [{ c: '#c9cbd6', off: [r * .25, r * .2] }], lw: 0 });
}

};
const _palc = {};
function lp(pair, lm) { // lit material: [base, shade, deep]
  const k = pair[0] + pair[1] + lm; if (_palc[k]) return _palc[k];
  const L = LM[lm];
  const f = c => { const C = hx(c); return [C[0] * L.mul[0] + L.add[0], C[1] * L.mul[1] + L.add[1], C[2] * L.mul[2] + L.add[2]]; };
  const b = f(pair[0]), s = mulc(f(pair[1]), L.sh);
  return (_palc[k] = [b, s, mulc(s, .72)]);
}
function lc1(c, lm) { const L = LM[lm], C = hx(c); return [C[0] * L.mul[0] + L.add[0], C[1] * L.mul[1] + L.add[1], C[2] * L.mul[2] + L.add[2]]; }

// ===================================================================
//  FILM — photographed-on-film finish: weave, grain, halation, dust
// ===================================================================
const FILM = { grain: [], small: null, sg: null };
function makeFilm() {
  for (let i = 0; i < 6; i++) {
    const c = mkCanvas(640, 360), g = c.getContext('2d'); const id = g.createImageData(640, 360), a = id.data;
    seed('grain', i);
    for (let p = 0; p < a.length; p += 4) { const v = 128 + (R() + R() + R() - 1.5) * 70; a[p] = a[p + 1] = a[p + 2] = v; a[p + 3] = 255; }
    g.putImageData(id, 0, 0); FILM.grain.push(c);
  }
  FILM.small = mkCanvas(160, 90); FILM.sg = FILM.small.getContext('2d');
}
// src: composed frame canvas; out: display ctx; fi: film frame index (24fps)
function filmFinish(src, out, fi, o = {}) {
  seed('film', fi);
  // gate weave: slow wander + tiny per-frame jitter
  const wx = vnoise(fi * .13, 1) * 1.6 + rnd(-.25, .25), wy = vnoise(fi * .11, 2) * 1.3 + rnd(-.25, .25);
  out.fillStyle = '#050407'; out.fillRect(0, 0, W, H);
  out.drawImage(src, -6 + wx, -4 + wy, W + 12, H + 8);
  // halation / bloom from bright areas
  const sg = FILM.sg;
  sg.filter = 'brightness(.85) contrast(3.2) blur(1.5px)'; sg.globalCompositeOperation = 'source-over';
  sg.drawImage(src, 0, 0, 160, 90); sg.filter = 'none';
  out.save(); out.globalCompositeOperation = 'screen'; out.globalAlpha = (o.bloom ?? .22); out.imageSmoothingQuality = 'high';
  out.drawImage(FILM.small, -10, -10, W + 20, H + 20);
  out.restore();
  // exposure flicker
  const fl = rnd(-.025, .025);
  if (fl > 0) { out.fillStyle = `rgba(255,248,235,${fl * .6})`; out.globalCompositeOperation = 'screen'; out.fillRect(0, 0, W, H); }
  else { out.fillStyle = `rgba(0,0,0,${-fl})`; out.globalCompositeOperation = 'source-over'; out.fillRect(0, 0, W, H); }
  // grain
  out.globalCompositeOperation = 'overlay'; out.globalAlpha = o.grain ?? .2;
  const gi = FILM.grain[fi % 6]; const gx = -rnd(0, 300), gy = -rnd(0, 160);
  out.drawImage(gi, gx, gy, 1280 * 1.25, 720 * 1.25);
  out.globalAlpha = 1;
  // lifted blacks + slight warm print tone
  out.globalCompositeOperation = 'lighten'; out.fillStyle = '#110f17'; out.fillRect(0, 0, W, H);
  out.globalCompositeOperation = 'soft-light'; out.fillStyle = 'rgba(255,214,170,.10)'; out.fillRect(0, 0, W, H);
  out.globalCompositeOperation = 'source-over';
  // vignette
  const vg = out.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * .98);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.42)');
  out.fillStyle = vg; out.fillRect(0, 0, W, H);
  // dust & hair
  const nd = rndi(0, 4);
  for (let i = 0; i < nd; i++) {
    const x = rnd(0, W), y = rnd(0, H), r = rnd(.6, 2.4);
    out.fillStyle = R() < .7 ? 'rgba(10,8,8,.55)' : 'rgba(240,235,225,.35)';
    out.beginPath(); out.ellipse(x, y, r, r * rnd(.5, 1), rnd(0, 3), 0, TAU); out.fill();
  }
  if (R() < .06) { const x = rnd(0, W), y = rnd(0, H); out.strokeStyle = 'rgba(15,10,10,.45)'; out.lineWidth = .8; out.beginPath(); out.moveTo(x, y); out.bezierCurveTo(x + rnd(-30, 30), y + rnd(-30, 30), x + rnd(-30, 30), y + rnd(-30, 30), x + rnd(-40, 40), y + rnd(-40, 40)); out.stroke(); }
  if (R() < .04) { const x = rnd(0, W); out.fillStyle = 'rgba(230,225,215,.08)'; out.fillRect(x, 0, 1, H); }
  if (o.fade != null) { out.fillStyle = `rgba(0,0,0,${o.fade})`; out.fillRect(0, 0, W, H); }
}

// night colour model: deeper, bluer
LM.night = { mul: [.4, .44, .67], add: [5, 7, 20], sh: .66, hl: '#56689a', lc: '#140e1a' };
LM.moon = { mul: [.52, .58, .8], add: [10, 12, 26], sh: .7, hl: '#7d8cc0', lc: '#161222' };
const SHOTS = [];
function shot(t0, t1, name, draw) { SHOTS.push({ t0, t1, name, draw }); }
function shotAt(t) { for (const s of SHOTS) if (t >= s.t0 && t < s.t1) return s; return SHOTS[SHOTS.length - 1]; }
const FLASH_T = [4.6, 13.55, 35.0, 50.9];
function flashAt(t) {
  let v = 0;
  for (const te of FLASH_T) {
    const d = t - te; if (d < 0 || d > .7) continue;
    v = Math.max(v, d < .084 ? 1 : d < .125 ? .1 : d < .21 ? .85 : Math.max(0, .7 * (1 - (d - .21) / .45)));
  }
  return v;
}
// keys: [[t, value, moveDur, easeName]] — holds a key, then moves into the next one during its moveDur
const EZ = { io: easeIO, o: easeOut, i: easeIn, l: t => t };
function seq(lt, keys) {
  let j = 0; for (let i = 0; i < keys.length; i++) if (keys[i][0] <= lt) j = i;
  const a = keys[j], b = keys[j + 1];
  if (b && b[2] && lt >= b[0] - b[2]) {
    const u = clamp((lt - (b[0] - b[2])) / b[2], 0, 1), e = EZ[b[3] || 'io'](u);
    return typeof a[1] === 'number' ? { v: lerp(a[1], b[1], e), id: 'm' + j + '_' + Math.round(u * 12) } : { v: lerpPose(a[1], b[1], e), id: 'm' + j + '_' + Math.round(u * 12) };
  }
  if (lt < keys[0][0]) return { v: keys[0][1], id: 'k0' };
  return { v: a[1], id: 'k' + j };
}
const sv = (lt, keys) => seq(lt, keys).v;
// screen position of a joint for a pose placed with o {x,y,s,f}
function jpos(p, o, path) {
  const J = fk(p); let q = J; for (const k of path.split('.')) q = q[k];
  return [o.x + (o.f || 1) * q[0] * o.s, o.y + q[1] * o.s];
}
// head-local point to screen (matches drawHead projection)
function headPt(o, x, y) { const T = o.tilt || 0, c = Math.cos(T), s = Math.sin(T); return [o.x + (o.f || 1) * (x * c - y * s) * o.r, o.y + (x * s + y * c) * o.r]; }

const TMP = mkCanvas(W, H), TX = TMP.getContext('2d');
function reflectDraw(ctx, groundY, fn, al = .22) {
  TX.setTransform(1, 0, 0, 1, 0, 0); TX.clearRect(0, 0, W, H); fn(TX);
  ctx.save(); ctx.globalAlpha = al; ctx.translate(0, groundY * 2 + 4); ctx.scale(1, -.85);

}
function bg(ctx, img, x, y, s = 1, fl = 0) {

function flashRim(fl, d = [.7, -.7]) { return fl > .4 ? { d, c: '#e8eeff', lc: '#b8c8ff', k: 3.5 } : null; }
function lmFor(fl, base = 'night') { return fl > .4 ? 'flash' : base; }

function drips(ctx, pts, lt, sc, sd) {

  // bamboo flute (shakuhachi-like): breathy sine with slow vibrato, miyako-bushi phrase
  const flute = (t, midi, dur, v = .16) => {
    if (!live(t)) return; const f = 440 * Math.pow(2, (midi - 69) / 12);
    const o = ac.createOscillator(), vib = ac.createOscillator(), vg = gainN(f * .012), g = gainN(0);
    o.type = 'sine'; o.frequency.setValueAtTime(f * .97, at(t)); o.frequency.linearRampToValueAtTime(f, at(t + .25));
    vib.frequency.value = 4.6; vib.connect(vg); vg.connect(o.frequency);
    chain(o, g); send(g, .8, .9);
    g.gain.setValueAtTime(0, at(t)); g.gain.linearRampToValueAtTime(v, at(t + .3)); g.gain.setValueAtTime(v * .85, at(t + dur * .7)); g.gain.linearRampToValueAtTime(0, at(t + dur));
    o.start(at(t)); vib.start(at(t + .4)); o.stop(at(t + dur + .05)); vib.stop(at(t + dur + .05));
    const s = src(WN), b = filt('bandpass', f * 1.5, 1.5), bg_ = gainN(0); chain(s, b, bg_); send(bg_, .7, .8);
    bg_.gain.setValueAtTime(0, at(t)); bg_.gain.linearRampToValueAtTime(v * .35, at(t + .08)); bg_.gain.linearRampToValueAtTime(v * .12, at(t + .4)); bg_.gain.linearRampToValueAtTime(0, at(t + dur));
    s.start(at(t), Math.random()); s.stop(at(t + dur + .05));
  };
  const phrase = [[68.4, 69, 2.2], [70.8, 70, 1.2], [72.1, 69, 1.0], [73.2, 67, 2.4], [75.9, 62, 1.4], [77.4, 65, 1.0], [78.4, 62, 1.6]];
  for (const [t, n, d] of phrase) flute(t, n, d, .15);
}

// ===================================================================
//  MAIN — projector: loads the boards, runs the film off the audio clock
// ===================================================================
const SCR = document.getElementById('scr'), SX = SCR.getContext('2d');
const CMP = mkCanvas(W, H), CX = CMP.getContext('2d');
let lastFi = -1, lastKey = '';
// shots that have something moving on ones (effects, shakes, impact strobes)
const ONES = new Set(['puddle', 'clash', 'exchange', 'graze', 'punch', 'kick', 'fire', 'elec', 'charge', 'impact']);
function renderFrame(t, force) {
  const fi = Math.min(Math.floor(t * FPS), DUR * FPS - 1), tq = fi / FPS;
  const S = shotAt(tq), lt = tq - S.t0, k = Math.floor(lt * 12);
  const key = S.name + ':' + (ONES.has(S.name) ? fi : k) + (tq > 78.2 ? fi : '');
  if (key === lastKey && !force) { filmFinish(CMP, SX, fi, { fade: tq > 78.2 ? clamp((tq - 78.2) / 1.6, 0, 1) : null }); lastFi = fi; return; }
  lastKey = key;
  CX.setTransform(1, 0, 0, 1, 0, 0); CX.globalAlpha = 1; CX.globalCompositeOperation = 'source-over'; CX.filter = 'none';
  CX.fillStyle = '#000'; CX.fillRect(0, 0, W, H);
  S.draw(CX, lt, k, tq);
  CX.setTransform(1, 0, 0, 1, 0, 0); CX.globalAlpha = 1; CX.globalCompositeOperation = 'source-over'; CX.filter = 'none';
  const fade = tq > 78.2 ? clamp((tq - 78.2) / 1.6, 0, 1) : null;
  filmFinish(CMP, SX, fi, { fade });
  lastFi = fi;
}
window.__render = t => { renderFrame(t, true); return shotAt(t).name; };

const UI = document.getElementById('ui'), MSG = document.getElementById('msg');
let ready = false, playing = false, t0 = 0, pausedAt = 0, actx = null, master = null;
const step = (msg, fn) => new Promise(res => { MSG.textContent = msg; setTimeout(() => { fn(); res(); }, 30); });
(async () => {
  await step('종이를 펴는 중…', makePaper);
  await step('배경을 그리는 중…', buildBackgrounds);
  await step('비를 그리는 중…', makeRain);
  await step('필름을 감는 중…', makeFilm);
  ready = true; window.__ready = true;
  const q = new URLSearchParams(location.search);
  const ts = parseFloat(q.get('t') || '0');
  renderFrame(ts || 0);
  MSG.textContent = '▶ 클릭해서 상영';
})();
function now() { return actx ? actx.currentTime - t0 : 0; }
function loop() {
  if (!playing) return;
  const t = now();
  if (t >= DUR) { playing = false; renderFrame(DUR - .01); UI.classList.remove('hide'); MSG.textContent = '↻ 다시 보기'; pausedAt = 0; return; }
  if (Math.floor(t * FPS) !== lastFi) renderFrame(t);
  requestAnimationFrame(loop);
}
function play(from = 0) {
  if (!ready) return;
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  if (master) { try { master.disconnect(); } catch (e) { } }
  master = actx.createGain(); master.gain.value = .9; master.connect(actx.destination);
  t0 = actx.currentTime + .15 - from;
  try { scoreAudio(actx, master, t0, from); } catch (e) { console.warn(e); }
  playing = true; UI.classList.add('hide'); lastFi = -1; requestAnimationFrame(loop);
}
function pause() {
  if (!playing) return; pausedAt = now(); playing = false;
  if (master) { master.gain.setTargetAtTime(0, actx.currentTime, .02); const m = master; setTimeout(() => { try { m.disconnect(); } catch (e) { } }, 200); master = null; }
}
UI.addEventListener('click', () => play(pausedAt || 0));
SCR.addEventListener('click', () => { if (playing) pause(); else play(pausedAt); });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (playing) pause(); else play(pausedAt); }
  if (e.code === 'KeyR') { pause(); pausedAt = 0; play(0); }
});
