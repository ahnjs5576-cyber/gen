# 저장소 전체를 GitHub Pages로 배포한다.
#   루트:  하루 CS 앱      → https://ahnjs5576-cyber.github.io/gen/
#   kart/: 젠 카트 러시    → https://ahnjs5576-cyber.github.io/gen/kart/
name: Deploy to GitHub Pages

on:
  push:
    branches: [ccr-738236c6-2bo2wq]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
