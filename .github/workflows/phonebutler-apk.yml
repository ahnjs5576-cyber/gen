name: 폰비서 APK 빌드

on:
  push:
    paths:
      - "voice-agent/**"
      - ".github/workflows/phonebutler-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-agent
    env:
      HAS_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # (선택) 저장소 Secrets에 서명 키를 넣어 두면 매번 같은 키로 서명돼서 '업데이트 설치'가 된다.
      - name: 서명 키 준비
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: 테스트
        run: ./gradlew testDebugUnitTest --console=plain

      - name: APK 빌드
        run: |
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/phonebutler.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: phonebutler-apk
          path: ${{ runner.temp }}/phonebutler.apk

      # 휴대폰 브라우저에서 바로 받을 수 있게 고정 주소의 Release에도 올린다
      - name: Release에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phonebutler-latest
          target_commitish: ${{ github.sha }}
          name: 폰비서 최신 APK
          prerelease: true
          make_latest: false
          files: ${{ runner.temp }}/phonebutler.apk
          body: |
            휴대폰에서 아래 `phonebutler.apk`를 눌러 내려받아 설치하세요.
            빌드: ${{ github.sha }} (${{ github.ref_name }})
            ${{ env.HAS_KEY == 'true' && '고정 서명 키로 서명됨 — 기존 앱 위에 업데이트 설치됩니다.' || '임시 키로 서명됨 — 이전 버전이 있으면 지우고 설치하세요. (voice-agent/README.md의 서명 키 설정 참고)' }}
